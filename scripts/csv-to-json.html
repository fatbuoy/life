<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSV → JSON Converter</title>
  <style>
    body { font-family: monospace; background: #0F1117; color: #E8E4DC;
           padding: 2rem; max-width: 900px; margin: 0 auto; }
    h1 { margin-bottom: 1.5rem; font-size: 1.2rem; }
    .drop-zone { border: 2px dashed #2A3040; border-radius: 8px;
                 padding: 3rem; text-align: center; color: #7A8099;
                 cursor: pointer; margin-bottom: 1.5rem;
                 transition: border-color 0.2s; }
    .drop-zone.over { border-color: #E8C96A; color: #E8C96A; }
    textarea { width: 100%; height: 300px; background: #0A0D14;
               border: 1px solid #1E2840; color: #A8B4CC;
               padding: 1rem; font-size: 0.75rem; border-radius: 6px;
               font-family: monospace; margin-bottom: 1rem; }
    button { background: #E8C96A; color: #0F1117; border: none;
             padding: 0.6rem 1.4rem; border-radius: 4px;
             font-family: monospace; font-size: 0.8rem;
             cursor: pointer; font-weight: 700; margin-right: 0.75rem; }
    button:disabled { opacity: 0.4; cursor: default; }
    label { font-size: 0.75rem; color: #7A8099; display: block;
            margin-bottom: 0.3rem; }
    input[type=text] { background: #0A0D14; border: 1px solid #1E2840;
                       color: #E8E4DC; padding: 0.4rem 0.6rem;
                       border-radius: 4px; font-family: monospace;
                       font-size: 0.75rem; width: 100%; margin-bottom: 1rem; }
    .status { font-size: 0.75rem; color: #7DB87A; margin-top: 0.5rem; }
    .err { color: #E8775A; }
    select { background: #0A0D14; border: 1px solid #1E2840;
             color: #E8E4DC; padding: 0.4rem; border-radius: 4px;
             font-family: monospace; font-size: 0.75rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>CSV → JSON Converter</h1>

  <label>Output filename</label>
  <input type="text" id="filename" value="budget.json" placeholder="budget.json">

  <label>Root array key (what to call the array in JSON)</label>
  <input type="text" id="arrayKey" value="months" placeholder="months">

  <label>CSV delimiter</label>
  <select id="delimiter">
    <option value=",">Comma (,)</option>
    <option value=";">Semicolon (;)</option>
    <option value="\t">Tab</option>
  </select>

  <div class="drop-zone" id="dropZone">
    Drop CSV file here, or click to browse
    <input type="file" id="fileInput" accept=".csv"
           style="display:none">
  </div>

  <textarea id="output" readonly placeholder="JSON output will appear here..."></textarea>
  <div class="status" id="status"></div>

  <button id="downloadBtn" disabled>Download JSON</button>
  <button onclick="document.getElementById('output').select();
          document.execCommand('copy')">Copy to clipboard</button>

  <script>
  let convertedJSON = null;

  // Drag and drop
  const zone = document.getElementById('dropZone');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('over'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('over');
    readFile(e.dataTransfer.files[0]);
  });
  zone.addEventListener('click', () => document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change', e => readFile(e.target.files[0]));

  function readFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => convertCSV(e.target.result);
    reader.readAsText(file, 'UTF-8');
  }

  function convertCSV(csvText) {
    try {
      const delim    = document.getElementById('delimiter').value;
      const arrayKey = document.getElementById('arrayKey').value || 'rows';
      const lines    = csvText.trim().split('\n');
      const headers  = lines[0].split(delim).map(h => toKey(h));
      const rows     = [];

      for (let i = 1; i < lines.length; i++) {
        const cells = lines[i].split(delim);
        if (cells.every(c => !c.trim())) continue; // skip blank lines
        const obj = {};
        headers.forEach((key, idx) => {
          obj[key] = parseValue(cells[idx]);
        });
        rows.push(obj);
      }

      convertedJSON = {
        meta: {
          lastUpdated:   new Date().toISOString().split('T')[0],
          rowCount:      rows.length,
          generatedFrom: "csv-to-json converter"
        },
        [arrayKey]: rows
      };

      const pretty = JSON.stringify(convertedJSON, null, 2);
      document.getElementById('output').value = pretty;
      document.getElementById('status').textContent =
        `✓ Converted ${rows.length} rows, ${headers.length} columns`;
      document.getElementById('status').className = 'status';
      document.getElementById('downloadBtn').disabled = false;
    } catch (err) {
      document.getElementById('status').textContent = `Error: ${err.message}`;
      document.getElementById('status').className = 'status err';
    }
  }

  // Convert header string to camelCase key
  function toKey(str) {
    return str.trim()
      .replace(/[^a-zA-Z0-9 ]/g, '')
      .replace(/\s+(.)/g, (_, c) => c.toUpperCase())
      .replace(/^\w/, c => c.toLowerCase());
  }

  // Auto-detect and parse value types
  function parseValue(val) {
    if (!val || val.trim() === '' || val.trim() === '-' || val.trim() === 'N/A')
      return null;
    const clean = val.trim().replace(/,/g, ''); // remove thousands commas
    if (!isNaN(clean) && clean !== '') return Number(clean);
    return val.trim();
  }

  document.getElementById('downloadBtn').addEventListener('click', () => {
    if (!convertedJSON) return;
    const name = document.getElementById('filename').value || 'output.json';
    const blob = new Blob([JSON.stringify(convertedJSON, null, 2)],
                             { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
  });
  </script>
</body>
</html>
