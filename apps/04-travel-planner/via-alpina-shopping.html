<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Via Alpina Packing Tracker — Sahani Suite</title>
    <link rel="stylesheet" href="../../shared/base.css">
    
    <style>
        /* Theme Overrides for this tracking app */
        :root {
            --app-primary:    #0c2340; /* Deep Navy Header */
            --app-primary2:   #1a3a5c; /* Mid Navy Badges */
            --app-primary3:   #2d5a8a; /* Light Navy Borders */
            --app-accent:     #185fa5; /* Blue Actions/Checkboxes */
            --app-on-primary:    #ffffff;
            --app-on-primary2:   #a8cfed;
            --app-on-primary3:   #7fa8cc;
        }

        /* Custom structural alignments for form layout elements */
        .input-field {
            width: 100%;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            padding: 8px 12px;
            font-size: var(--t-base);
            font-family: inherit;
            color: var(--text);
            outline: none;
            transition: border-color .15s;
        }
        .input-field:focus {
            border-color: var(--app-accent);
        }

        /* Custom styled checkboxes matching the design language */
        .item-checkbox {
            width: 16px;
            height: 16px;
            accent-color: var(--app-accent);
            cursor: pointer;
        }

        /* Inline button components leveraging base tokens */
        .btn {
            padding: 6px 12px;
            border-radius: var(--r-md);
            font-size: var(--t-sm);
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all .15s;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-primary { background: var(--app-accent); color: white; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary { background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
        .btn-secondary:hover { border-color: #bbb; color: var(--text); }
        .btn-danger { background: var(--bg-danger); color: var(--c-danger); }
        .btn-danger:hover { background: #fcdad7; }

        /* Scannable crossed out state for completed rows */
        .item-checked-text {
            text-decoration: line-through;
            color: var(--faint);
        }
        
        .profile-title {
            font-size: var(--t-lg);
            font-weight: 700;
            color: var(--text);
            text-transform: capitalize;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="container">
            <div class="header-row">
                <div class="header-left">
                    <a class="header-home" href="#">⌂</a>
                    <span class="header-title">Via Alpina Packing Tracker (22 Days)</span>
                </div>
                <div class="header-right">
                    <span class="header-badge">v1.1</span>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        
        <div class="mb-3">
            <div class="sec-lbl">Active Hiker Profile</div>
            <div class="period-strip">
                <button class="period-btn active" id="prof-rishi" onclick="switchUser('rishi')">Rishi</button>
                <button class="period-btn" id="prof-marion" onclick="switchUser('marion')">Marion</button>
            </div>
        </div>

        <div class="mb-3">
            <div class="sec-lbl">Filter Packing Status</div>
            <div class="filter-pill-bar">
                <button class="filter-pill active" id="filter-all" onclick="switchFilter('all')">All Items</button>
                <button class="filter-pill" id="filter-ready" onclick="switchFilter('ready')">✅ Ready / Packed</button>
                <button class="filter-pill" id="filter-tobuy" onclick="switchFilter('tobuy')">🛒 To Buy</button>
            </div>
        </div>

        <div class="card">
            <div class="sec-lbl" style="margin-bottom: 8px;">Add New Item to Active Profile</div>
            <div class="grid-2">
                <input type="text" id="newItemName" class="input-field" placeholder="Item name (e.g., Salomon X Ultra Boots)">
                <input type="text" id="newItemNotes" class="input-field" placeholder="Notes or links (https://...)">
            </div>
            <div class="flex-between mt-3">
                <button class="btn btn-secondary" onclick="exportState()">📤 Export JSON Backup</button>
                <button class="btn btn-primary" onclick="addItem()">➕ Add Item</button>
            </div>
        </div>

        <div class="flex-between mb-2">
            <span class="profile-title" id="activeProfileLabel">Me's Packing List</span>
            <span class="badge badge-neutral" id="listCounter">0 / 0 Packed</span>
        </div>

        <div id="itemsContainer"></div>

    </main>

    <script>
        // Default initial items baseline completely imported from your markdown file specifications
        const initialDefaultItems = [
            // Footwear
            { id: 101, name: "Footwear: Trekking boots, lightweight mid-cut (1 pair)", notes: "🛒 [Need to Buy] Salomon X Ultra 5 Mid GTX or La Sportiva Ultra Raptor 3 Mid — buy now, needs break-in miles before late July", checked: false },
            { id: 102, name: "Footwear: Hut/town shoes (1 pair)", notes: "🛒 [Need to Buy] Lightweight packable sandals or foam slip-ons (~150–200g) — most huts require swapping out of boots", checked: false },
            { id: 103, name: "Footwear: Trail running shoes (1 pair)", notes: "🛒 [Need to Buy] Saucony Peregrine 16 (versatile all-rounder, Vibram Megagrip, reasonably light) or Altra Lone Peak 9 (wider toe box, zero-drop, very popular with hikers too) — both pack down far smaller than the NovaBlast 5/Endorphin Pro and double as your go-to for future light day hikes", checked: false },
            { id: 104, name: "Footwear: Hiking socks", notes: "✅+🛒 [Own + Buy] You have 2 pairs Mountain Hardwear (synthetic); add 1–2 more — ideally merino, for odor/moisture control over 22 days — for a safe 3–4 pair rotation", checked: false },
            
            // Lower Body Clothing
            { id: 201, name: "Lower Body: Hiking shorts (Northface Speedlight) (1)", notes: "✅ [Own] Primary daytime bottom", checked: true },
            { id: 202, name: "Lower Body: Hiking pants (Arc'teryx Konseal) (1)", notes: "✅ [Own] Cold/wind days, evenings, bug protection", checked: true },
            { id: 203, name: "Lower Body: Rain pants (North Face Hyvent 2.5L) (1)", notes: "✅ [Own] Already covered", checked: true },
            { id: 204, name: "Lower Body: Underwear (Jockey sport/quick-dry) (4)", notes: "✅ [Own] Confirmed sufficient with periodic laundry", checked: true },
            { id: 205, name: "Lower Body: Gaiters (lightweight) (1 pair)", notes: "⚠️ [Decision Needed] Conditional — only if Stage 13 Blüemlisalphütte high route or late-season snow patches are in play", checked: false },
            
            // Upper Body & Insulation
            { id: 301, name: "Upper Body: Hiking t-shirt / long-sleeve technical shirts (On, Hoka) (2–3 total)", notes: "✅ [Own] Rotate: 1 worn, 1 drying, 1 spare", checked: true },
            { id: 302, name: "Upper Body: Columbia long-sleeve hiking shirt (1)", notes: "✅ [Own] Sun protection / cooler days", checked: true },
            { id: 303, name: "Upper Body: Midweight fleece or merino layer (1)", notes: "🛒 [Need to Buy] Gap layer between base layers and the down jacket — needed for cold, windy pass crossings", checked: false },
            { id: 304, name: "Upper Body: Uniqlo ultralight down jacket (1)", notes: "✅ [Own] Static/evening insulation", checked: true },
            { id: 305, name: "Upper Body: Rain shell — Mammut Dry Tech Premium (1)", notes: "✅ [Own] Recommended primary over the Norvan SL: pit zips matter on long sustained climbs, and Gore-Tex Shakedry fabric is well known for abrading/delaminating against loaded pack straps over multi-week use — a real risk with a packed Salomon Peak 30L worn daily for 22 days. Leave the Norvan SL home, or bring it only as a featherweight spare if there's room", checked: true },
            { id: 306, name: "Upper Body: Evening/sleep top (optional) (0–1)", notes: "A spare shirt can double as sleepwear; skip a dedicated piece", checked: false },
            
            // Head, Hands, Accessories
            { id: 401, name: "Accessories: Buff (1)", notes: "✅ [Own]", checked: true },
            { id: 402, name: "Accessories: Sunglasses (1)", notes: "✅ [Own]", checked: true },
            { id: 403, name: "Accessories: Lightweight gloves (1 pair)", notes: "✅ [Own]", checked: true },
            { id: 404, name: "Accessories: Warm hat/beanie (1)", notes: "✅ [Own] Your wool hats are fine — no need for a dedicated 'technical' one", checked: true },
            { id: 405, name: "Accessories: Sun hat with brim (1)", notes: "🛒 [Need to Buy] Adds face/ear/neck shade — pairs with long sleeves and buff to cut down sunscreen needs", checked: false },
            
            // Sleep System
            { id: 501, name: "Sleep System: Silk sleeping bag liner (1)", notes: "🛒 [Need to Buy] Required or strongly preferred at most huts even with bedding provided (~150g)", checked: false },
            { id: 502, name: "Sleep System: Earplugs", notes: "✅ [Own] Dorm-style huts get loud", checked: true },
            { id: 503, name: "Sleep System: Eye mask", notes: "✅ [Own]", checked: true },
            
            // Pack & Hydration
            { id: 601, name: "Pack/Hydration: Salomon Peak 30L (1)", notes: "✅ [Own]", checked: true },
            { id: 602, name: "Pack/Hydration: Pack liner / dry bags (1–2)", notes: "🛒 [Need to Buy] Waterproofs contents without relying on a separate rain cover", checked: false },
            { id: 603, name: "Pack/Hydration: Sigg aluminium bottles (2)", notes: "✅ [Own] (verify) Confirm combined capacity ≥1.5L", checked: true },
            { id: 604, name: "Pack/Hydration: Water purification tablets (1 pack)", notes: "🛒 [Need to Buy] For stream refills between huts/hotels", checked: false },
            
            // Navigation & Electronics
            { id: 701, name: "Electronics: Headlamp + spare batteries (1)", notes: "🛒 [Need to Buy] Pre-dawn starts, hut common areas after lights-out", checked: false },
            { id: 702, name: "Electronics: Power bank (1)", notes: "🛒 [Need to Buy] Small (5,000–10,000mAh) — huts rarely have ample outlets", checked: false },
            { id: 703, name: "Electronics: Charging cables", notes: "🛒 [Need to Buy] as needed", checked: false },
            { id: 704, name: "Electronics: Phone with offline maps (SwitzerlandMobility)", notes: "✅ [Own] Already part of your planning workflow", checked: true },
            
            // Health & Hygiene
            { id: 801, name: "Hygiene: Blister kit (Compeed) (small)", notes: "🛒 [Need to Buy] Non-negotiable for 22 consecutive days", checked: false },
            { id: 802, name: "Hygiene: Leukotape (1 roll)", notes: "🛒 [Need to Buy] Preventative taping for hot spots", checked: false },
            { id: 803, name: "Hygiene: Personal first aid + meds (small kit)", notes: "🛒 [Need to Buy]", checked: false },
            { id: 804, name: "Hygiene: Sunscreen, high SPF (1 small stick ~20g)", notes: "🛒 [Need to Buy] Long sleeves + buff + brimmed hat cover most skin, but face, ears, and hands stay exposed — scale down to a small stick rather than a full tube, don't skip it entirely", checked: false },
            { id: 805, name: "Hygiene: SPF lip balm (1)", notes: "🛒 [Need to Buy]", checked: false },
            { id: 806, name: "Hygiene: Quick-dry travel towel (1)", notes: "✅ [Own]", checked: true },
            { id: 807, name: "Hygiene: Travel soap/wash (1 small)", notes: "🛒 [Need to Buy] Doubles as laundry soap for sink-washing socks/underwear", checked: false },
            { id: 808, name: "Hygiene: Toothbrush/toothpaste (travel size)", notes: "🛒 [Need to Buy]", checked: false },
            
            // Repair & Misc
            { id: 901, name: "Repair/Misc: Gear repair tape (Tenacious Tape) (small strip)", notes: "🛒 [Need to Buy]", checked: false },
            { id: 902, name: "Repair/Misc: Spare trekking pole tip (1)", notes: "🛒 [Need to Buy]", checked: false },
            { id: 903, name: "Repair/Misc: Mountain Hardwear poles (1 pair)", notes: "✅ [Own]", checked: true },
            { id: 904, name: "Repair/Misc: Small ziplock/stuff bags (a few)", notes: "🛒 [Need to Buy] Organization, keeps wet/dry separated", checked: false },
            
            // Documents & Money
            { id: 1001, name: "Documents: ID / passport", notes: "✅ [Own] (assumed)", checked: true },
            { id: 1002, name: "Documents: Accommodation confirmations", notes: "✅ [Own] Already booked per your stage planner", checked: true },
            { id: 1003, name: "Documents: Cash (CHF)", notes: "🛒 [Need to Buy] Many huts are cash-only", checked: false },
            { id: 1004, name: "Documents: Cards", notes: "✅ [Own] (assumed)", checked: true }
        ];

        // Core UI Context State Definition
        let currentUser = 'me';
        let currentFilter = 'all';
        let editingItemId = null;

        // Structured Profile Data State Root Matrix Base
        let listData = JSON.parse(localStorage.getItem('sahani_via_alpina_dual_data')) || {
            rishi: JSON.parse(JSON.stringify(initialDefaultItems)),
            marion: JSON.parse(JSON.stringify(initialDefaultItems))
        };

        // Persist local state mutations cleanly to client local storage data tracks
        function saveToStorage() {
            localStorage.setItem('sahani_via_alpina_dual_data', JSON.stringify(listData));
            updateCounter();
        }

        // Auto-link scanning filter targeting explicit absolute web addresses
        function linkifyText(text) {
            if (!text) return "";
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, function(url) {
                return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
            });
        }

        // Update list analytics badge counter indicators dynamically based on active dataset
        function updateCounter() {
            const activeItems = listData[currentUser];
            const completed = activeItems.filter(i => i.checked).length;
            document.getElementById('listCounter').textContent = `${completed} / ${activeItems.length} Packed`;
            document.getElementById('activeProfileLabel').textContent = `${currentUser === 'rishi' ? "Rishi's" : "Marion's"} Packing List`;
        }

        // Switch profile user logic track
        function switchUser(user) {
            currentUser = user;
            editingItemId = null; // Close active edit row fields context
            
            // Update profile tabs DOM status classes
            document.getElementById('prof-rishi').classList.toggle('active', user === 'rishi');
            document.getElementById('prof-marion').classList.toggle('active', user === 'marion');
            
            updateCounter();
            renderList();
        }

        // Filter manipulation controls track logic
        function switchFilter(filter) {
            currentFilter = filter;
            
            // Update filter tabs active layout configurations
            document.getElementById('filter-all').classList.toggle('active', filter === 'all');
            document.getElementById('filter-ready').classList.toggle('active', filter === 'ready');
            document.getElementById('filter-tobuy').classList.toggle('active', filter === 'tobuy');
            
            renderList();
        }

        // Append explicit item node array extensions targeting only the active profile track
        function addItem() {
            const nameInput = document.getElementById('newItemName');
            const notesInput = document.getElementById('newItemNotes');

            if (!nameInput.value.trim()) return alert("Please enter an item name.");

            const newItem = {
                id: Date.now(),
                name: nameInput.value.trim(),
                notes: notesInput.value.trim(),
                checked: false
            };

            listData[currentUser].push(newItem);
            nameInput.value = "";
            notesInput.value = "";
            
            saveToStorage();
            renderList();
        }

        // Checkbox Boolean State Mutation Trigger
        function toggleItemCheck(id) {
            listData[currentUser] = listData[currentUser].map(item => {
                if (item.id === id) {
                    return { ...item, checked: !item.checked };
                }
                return item;
            });
            saveToStorage();
            renderList();
        }

        // Initialize active inline editing track row mode layout context updates
        function startInlineEdit(id, event) {
            event.stopPropagation();
            editingItemId = id;
            renderList();
        }

        // Cancel editing configuration snap action
        function cancelEdit(event) {
            event.stopPropagation();
            editingItemId = null; 
            renderList();
        }

        // Save layout modifications made during tracking row inline edit views
        function saveInlineEdit(id, event) {
            event.stopPropagation();
            const editName = document.getElementById(`editName-${id}`).value.trim();
            const editNotes = document.getElementById(`editNotes-${id}`).value.trim();

            if (!editName) return alert("Item name cannot be blank.");

            listData[currentUser] = listData[currentUser].map(item => {
                if (item.id === id) {
                    return { ...item, name: editName, notes: editNotes };
                }
                return item;
            });

            editingItemId = null;
            saveToStorage();
            renderList();
        }

        // Structural node context removals
        function deleteItem(id, event) {
            event.stopPropagation();
            if (confirm("Are you sure you want to delete this item?")) {
                listData[currentUser] = listData[currentUser].filter(item => item.id !== id);
                if (editingItemId === id) editingItemId = null;
                saveToStorage();
                renderList();
            }
        }

        // Quick JSON state dump execution context fallback routine
        function exportState() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(listData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `via-alpina-packing-backup.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // Render Master Control UI Matrix System
        function renderList() {
            const container = document.getElementById('itemsContainer');
            container.innerHTML = "";

            // Filter active profile dataset context
            const filteredItems = listData[currentUser].filter(item => {
                if (currentFilter === 'ready') return item.checked;
                if (currentFilter === 'tobuy') return !item.checked;
                return true;
            });

            if (filteredItems.length === 0) {
                container.innerHTML = `<div class="notice notice-info"><div class="notice-body">No items match the selected criteria for this tracker list view.</div></div>`;
                return;
            }

            filteredItems.forEach(item => {
                if (item.id === editingItemId) {
                    // ── EDIT MODE ROW LAYOUT STRUCTURE ──
                    const editCard = document.createElement('div');
                    editCard.className = "card";
                    editCard.innerHTML = `
                        <div class="sec-lbl" style="color: var(--app-accent);">Editing Item Details</div>
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <div>
                                <label class="sec-lbl" style="font-size: 9px; display:block; margin-bottom:2px;">Item Name</label>
                                <input type="text" id="editName-${item.id}" class="input-field" value="${item.name}">
                            </div>
                            <div style="margin-bottom: var(--sp-3);">
                                <label class="sec-lbl" style="font-size: 9px; display:block; margin-bottom:2px;">Notes & Links (URLs will auto-link)</label>
                                <textarea id="editNotes-${item.id}" class="input-field" style="resize: vertical; min-height: 60px;">${item.notes}</textarea>
                            </div>
                        </div>
                        <div class="flex-between">
                            <button onclick="deleteItem(${item.id}, event)" class="btn btn-danger">🗑️ Delete</button>
                            <div class="flex gap-2">
                                <button onclick="cancelEdit(event)" class="btn btn-secondary">❌ Cancel</button>
                                <button onclick="saveInlineEdit(${item.id}, event)" class="btn btn-primary">💾 Save</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(editCard);
                } else {
                    // ── VIEW MODE ROW LAYOUT STRUCTURE (§13 Row-Item Pattern) ──
                    const itemWrap = document.createElement('div');
                    itemWrap.className = "row-item card";
                    itemWrap.style.padding = "10px 14px";
                    itemWrap.style.marginBottom = "8px";

                    itemWrap.innerHTML = `
                        <div class="ri-header">
                            <div class="ri-left">
                                <input type="checkbox" class="item-checkbox" ${item.checked ? 'checked' : ''} onchange="toggleItemCheck(${item.id})">
                                <span class="ri-name ${item.checked ? 'item-checked-text' : ''}" style="font-size: var(--t-md); white-space: normal;">
                                    ${item.name}
                                </span>
                            </div>
                            <div class="ri-right">
                                <button onclick="startInlineEdit(${item.id}, event)" class="btn btn-secondary" style="padding: 3px 8px; font-size: 11px;">✏️ Edit</button>
                            </div>
                        </div>
                        ${item.notes ? `
                            <div class="db-body" style="margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border2); color: var(--muted);">
                                ${linkifyText(item.notes)}
                            </div>
                        ` : ''}
                    `;
                    container.appendChild(itemWrap);
                }
            });
        }

        // Initialize patterns on document parse sequence completion
        document.addEventListener("DOMContentLoaded", () => {
            updateCounter();
            renderList();
        });
    </script>
</body>
</html>
