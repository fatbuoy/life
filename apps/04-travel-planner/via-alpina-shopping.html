<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Via Alpina Packing Tracker — Sahani Suite</title>
    <link rel="apple-touch-icon" href="../../images/icons/alpine_shopping.png">   
    <link rel="stylesheet" href="../../shared/base.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Theme Overrides for this tracking app */
        :root {
            --app-primary:    #0c2340; /* Deep Navy Header */
            --app-primary2:   #1a3a5c; /* Mid Navy Badges */
            --app-primary3:   #2d5a8a; /* Light Navy Borders */
            --app-accent:     #185fa5; /* Blue Actions/Checkboxes */
            --app-on-primary:    #ffffff;
            --app-on-primary2:   #a8cfed;
            --app-on-primary3:   #7fa8cc;
        }

        /* Responsive grid adjustment for forms */
        .responsive-form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        @media(min-width: 600px) {
            .responsive-form-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* Custom structural alignments for form layout elements */
        .input-field {
            width: 100%;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            padding: 8px 12px;
            font-size: var(--t-base);
            font-family: inherit;
            color: var(--text);
            outline: none;
            transition: border-color .15s;
        }
        .input-field:focus {
            border-color: var(--app-accent);
        }

        /* Custom styled checkboxes matching the design language */
        .item-checkbox {
            width: 18px;
            height: 18px;
            accent-color: var(--app-accent);
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Inline button components leveraging base tokens */
        .btn {
            padding: 6px 12px;
            border-radius: var(--r-md);
            font-size: var(--t-sm);
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all .15s;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .btn-primary { background: var(--app-accent); color: white; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary { background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
        .btn-secondary:hover { border-color: #bbb; color: var(--text); }
        .btn-danger { background: var(--bg-danger); color: var(--c-danger); }
        .btn-danger:hover { background: #fcdad7; }

        /* Scannable crossed out state for completed rows */
        .item-checked-text {
            text-decoration: line-through;
            color: var(--faint);
        }
        
        .profile-title {
            font-size: var(--t-lg);
            font-weight: 700;
            color: var(--text);
        }

        /* Category Header Container Design styling elements */
        .category-section {
            margin-bottom: 16px;
        }
        .category-header {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }
        .category-header:hover {
            background: #f1f5f9;
        }
        .category-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .category-title {
            font-size: var(--t-base);
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .category-icon-width {
            width: 14px;
            text-align: center;
            color: var(--muted);
        }
        
        /* Dynamic category-level track progress indicator status meter */
        .category-progress-container {
            width: 100%;
            background: var(--border2);
            border-radius: var(--r-sm);
            height: 6px;
            margin-top: 8px;
            overflow: hidden;
        }
        .category-progress-bar {
            background: var(--app-accent);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Mobile layout adaptations for row structure elements */
        .ri-header-mobile {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
        }
        .ri-left-mobile {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            flex: 1;
        }
        .ri-name-mobile {
            word-break: break-word;
            overflow-wrap: anywhere;
            line-height: 1.4;
        }

        /* Modal Layout System Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(12, 35, 64, 0.5); /* Primary tint backdrop overlay */
            backdrop-filter: blur(2px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 16px;
        }
        .modal-box {
            background: var(--white);
            border-radius: var(--r-lg);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 550px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
            animation: modalSlideIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }
        .modal-header {
            background: var(--surface);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-body {
            padding: 16px;
        }
        @keyframes modalSlideIn {
            from { transform: translateY(12px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="container">
            <div class="header-row">
                <div class="header-left">
                    <a class="header-home" href="#"><i class="fa-solid fa-house"></i></a>
                    <span class="header-title">Via Alpina Packing Tracker</span>
                </div>
                <div class="header-right">
                    <span class="header-badge">v1.5</span>
                </div>
            </div>
        </div>
    </header>

    <main class="container" style="padding-left: 12px; padding-right: 12px;">
        
        <div class="mb-3">
            <div class="sec-lbl">Active Hiker Profile</div>
            <div class="period-strip">
                <button class="period-btn active" id="prof-rishi" onclick="switchUser('rishi')">Rishi</button>
                <button class="period-btn" id="prof-marion" onclick="switchUser('marion')">Marion</button>
            </div>
        </div>

        <div class="mb-3 flex-between" style="gap: 12px; flex-wrap: wrap; align-items: flex-end;">
            <div style="flex: 1; min-width: 240px;">
                <div class="sec-lbl">Filter Packing Status</div>
                <div class="filter-pill-bar" style="overflow-x: auto; white-space: nowrap; padding-bottom: 4px; display: inline-flex; gap: 6px; width: 100%;">
                    <button class="filter-pill active" id="filter-all" onclick="switchFilter('all')">All Items</button>
                    <button class="filter-pill" id="filter-ready" onclick="switchFilter('ready')"><i class="fa-solid fa-circle-check"></i> Ready</button>
                    <button class="filter-pill" id="filter-tobuy" onclick="switchFilter('tobuy')"><i class="fa-solid fa-cart-shopping"></i> To Buy</button>
                </div>
            </div>
            <button class="btn btn-primary" onclick="openAddItemModal()" style="margin-bottom: 4px; height: 34px;"><i class="fa-solid fa-plus"></i> Add Item / Sync</button>
        </div>

        <div class="flex-between mb-2" style="gap: 8px; flex-wrap: wrap; align-items: center;">
            <div>
                <span class="profile-title" id="activeProfileLabel">Rishi's Packing List</span>
                <span class="badge badge-neutral" id="listCounter" style="margin-left: 4px;">0 / 0 Packed</span>
            </div>
            <div class="flex gap-2">
                <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 12px;" onclick="setAllCollapseState(false)"><i class="fa-solid fa-folder-open"></i> Expand All</button>
                <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 12px;" onclick="setAllCollapseState(true)"><i class="fa-solid fa-folder"></i> Collapse All</button>
            </div>
        </div>

        <div id="itemsContainer"></div>

    </main>

    <div id="addItemModal" class="modal-overlay" onclick="closeAddItemModalOutside(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span class="profile-title" style="font-size: var(--t-base); display: flex; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-sliders" style="color: var(--app-accent);"></i> Profile Options & New Item
                </span>
                <button class="btn btn-secondary" style="padding: 4px 8px; border: none; background: transparent;" onclick="closeAddItemModal()"><i class="fa-solid fa-xmark" style="font-size: var(--t-base);"></i></button>
            </div>
            <div class="modal-body">
                <div class="sec-lbl" style="margin-bottom: 8px;">Add New Item to Active Profile</div>
                
                <div class="responsive-form-grid">
                    <div>
                        <label class="sec-lbl" style="font-size: 10px; margin-bottom: 2px; display: block;">Item Name</label>
                        <input type="text" id="newItemName" class="input-field" placeholder="e.g., Salomon X Ultra Boots">
                    </div>
                    <div>
                        <label class="sec-lbl" style="font-size: 10px; margin-bottom: 2px; display: block;">Category Selection</label>
                        <select id="newItemCategory" class="input-field" style="height: 37px; -webkit-appearance: menulist; appearance: menulist;">
                            <option value="Footwear">Footwear</option>
                            <option value="Lower Body Clothing">Lower Body Clothing</option>
                            <option value="Upper Body & Insulation">Upper Body & Insulation</option>
                            <option value="Head, Hands, Accessories">Head, Hands, Accessories</option>
                            <option value="Sleep System">Sleep System</option>
                            <option value="Pack & Hydration">Pack & Hydration</option>
                            <option value="Navigation & Electronics">Navigation & Electronics</option>
                            <option value="Health & Hygiene">Health & Hygiene</option>
                            <option value="Repair & Misc">Repair & Misc</option>
                            <option value="Documents & Money">Documents & Money</option>
                        </select>
                    </div>
                </div>
                
                <div style="margin-top: 10px;">
                    <label class="sec-lbl" style="font-size: 10px; margin-bottom: 2px; display: block;">Notes or Links</label>
                    <input type="text" id="newItemNotes" class="input-field" placeholder="Notes or links (https://...)">
                </div>

                <div style="margin-top: 16px; margin-bottom: 4px;">
                    <button class="btn btn-primary" onclick="addItem()" style="width: 100%; justify-content: center;"><i class="fa-solid fa-plus"></i> Append Item Entry</button>
                </div>

                <div style="margin-top: 20px; border-top: 1px solid var(--border2); padding-top: 14px;">
                    <div class="sec-lbl" style="margin-bottom: 8px;">Storage Utilities & Synchronisation</div>
                    <div class="flex-between" style="gap: 8px; flex-wrap: wrap;">
                        <div class="flex gap-2">
                            <button class="btn btn-secondary" onclick="exportState()" style="padding: 6px 10px;"><i class="fa-solid fa-download"></i> Export</button>
                            <button class="btn btn-secondary" onclick="document.getElementById('importFileInput').click()" style="padding: 6px 10px;"><i class="fa-solid fa-upload"></i> Import</button>
                            <input type="file" id="importFileInput" style="display: none;" accept=".json" onchange="importState(event)">
                        </div>
                        <button class="btn btn-danger" onclick="resetToDefaults()" style="padding: 6px 10px;"><i class="fa-solid fa-trash-can"></i> Reset Cache</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Core baseline data matrix pre-populated comprehensively with category divisions
        const initialDefaultItems = [
            // Footwear
            { id: 101, category: "Footwear", name: "Trekking boots, lightweight mid-cut (1 pair)", notes: "[Need to Buy] Salomon X Ultra 5 Mid GTX or La Sportiva Ultra Raptor 3 Mid — buy now, needs break-in miles before late July", checked: false },
            { id: 102, category: "Footwear", name: "Hut/town shoes (1 pair)", notes: "[Need to Buy] Lightweight packable sandals or foam slip-ons (~150–200g) — most huts require swapping out of boots", checked: false },
            { id: 103, category: "Footwear", name: "Trail running shoes (1 pair)", notes: "[Need to Buy] Saucony Peregrine 16 (versatile all-rounder, Vibram Megagrip, reasonably light) or Altra Lone Peak 9 (wider toe box, zero-drop, very popular with hikers too) — both pack down far smaller than the NovaBlast 5/Endorphin Pro and double as your go-to for future light day hikes", checked: false },
            { id: 104, category: "Footwear", name: "Hiking socks", notes: "[Own + Buy] You have 2 pairs Mountain Hardwear (synthetic); add 1–2 more — ideally merino, for odor/moisture control over 22 days — for a safe 3–4 pair rotation", checked: false },
            
            // Lower Body Clothing
            { id: 201, category: "Lower Body Clothing", name: "Hiking shorts (Northface Speedlight) (1)", notes: "[Own] Primary daytime bottom", checked: true },
            { id: 202, category: "Lower Body Clothing", name: "Hiking pants (Arc'teryx Konseal) (1)", notes: "[Own] Cold/wind days, evenings, bug protection", checked: true },
            { id: 203, category: "Lower Body Clothing", name: "Rain pants (North Face Hyvent 2.5L) (1)", notes: "[Own] Already covered", checked: true },
            { id: 204, category: "Lower Body Clothing", name: "Underwear (Jockey sport/quick-dry) (4)", notes: "[Own] Confirmed sufficient with periodic laundry", checked: true },
            { id: 205, category: "Lower Body Clothing", name: "Gaiters (lightweight) (1 pair)", notes: "[Decision Needed] Conditional — only if Stage 13 Blüemlisalphütte high route or late-season snow patches are in play", checked: false },
            
            // Upper Body & Insulation
            { id: 301, category: "Upper Body & Insulation", name: "Hiking t-shirt / long-sleeve technical shirts (On, Hoka) (2–3 total)", notes: "[Own] Rotate: 1 worn, 1 drying, 1 spare", checked: true },
            { id: 302, category: "Upper Body & Insulation", name: "Columbia long-sleeve hiking shirt (1)", notes: "[Own] Sun protection / cooler days", checked: true },
            { id: 303, category: "Upper Body & Insulation", name: "Midweight fleece or merino layer (1)", notes: "[Need to Buy] Gap layer between base layers and the down jacket — needed for cold, windy pass crossings", checked: false },
            { id: 304, category: "Upper Body & Insulation", name: "Uniqlo ultralight down jacket (1)", notes: "[Own] Static/evening insulation", checked: true },
            { id: 305, category: "Upper Body & Insulation", name: "Rain shell — Mammut Dry Tech Premium (1)", notes: "[Own] Recommended primary over the Norvan SL: pit zips matter on long sustained climbs, and Gore-Tex Shakedry fabric is well known for abrading/delaminating against loaded pack straps over multi-week use — a real risk with a packed Salomon Peak 30L worn daily for 22 days. Leave the Norvan SL home, or bring it only as a featherweight spare if there's room", checked: true },
            { id: 306, category: "Upper Body & Insulation", name: "Evening/sleep top (optional) (0–1)", notes: "A spare shirt can double as sleepwear; skip a dedicated piece", checked: false },
            
            // Head, Hands, Accessories
            { id: 401, category: "Head, Hands, Accessories", name: "Buff (1)", notes: "[Own]", checked: true },
            { id: 402, category: "Head, Hands, Accessories", name: "Sunglasses (1)", notes: "[Own]", checked: true },
            { id: 403, category: "Head, Hands, Accessories", name: "Lightweight gloves (1 pair)", notes: "[Own]", checked: true },
            { id: 404, category: "Head, Hands, Accessories", name: "Warm hat/beanie (1)", notes: "[Own] Your wool hats are fine — no need for a dedicated 'technical' one", checked: true },
            { id: 405, category: "Head, Hands, Accessories", name: "Sun hat with brim (1)", notes: "[Need to Buy] Adds face/ear/neck shade — pairs with long sleeves and buff to cut down sunscreen needs", checked: false },
            
            // Sleep System
            { id: 501, category: "Sleep System", name: "Silk sleeping bag liner (1)", notes: "[Need to Buy] Required or strongly preferred at most huts even with bedding provided (~150g)", checked: false },
            { id: 502, category: "Sleep System", name: "Earplugs", notes: "[Own] Dorm-style huts get loud", checked: true },
            { id: 503, category: "Sleep System", name: "Eye mask", notes: "[Own]", checked: true },
            
            // Pack & Hydration
            { id: 601, category: "Pack & Hydration", name: "Salomon Peak 30L (1)", notes: "[Own]", checked: true },
            { id: 602, category: "Pack & Hydration", name: "Pack liner / dry bags (1–2)", notes: "[Need to Buy] Waterproofs contents without relying on a separate rain cover", checked: false },
            { id: 603, category: "Pack & Hydration", name: "Sigg aluminium bottles (2)", notes: "[Own] (verify) Confirm combined capacity ≥1.5L", checked: true },
            { id: 604, category: "Pack & Hydration", name: "Water purification tablets (1 pack)", notes: "[Need to Buy] For stream refills between huts/hotels", checked: false },
            
            // Navigation & Electronics
            { id: 701, category: "Navigation & Electronics", name: "Headlamp + spare batteries (1)", notes: "[Need to Buy] Pre-dawn starts, hut common areas after lights-out", checked: false },
            { id: 702, category: "Navigation & Electronics", name: "Power bank (1)", notes: "[Need to Buy] Small (5,000–10,000mAh) — huts rarely have ample outlets", checked: false },
            { id: 703, category: "Navigation & Electronics", name: "Charging cables", notes: "[Need to Buy] as needed", checked: false },
            { id: 704, category: "Navigation & Electronics", name: "Phone with offline maps (SwitzerlandMobility)", notes: "[Own] Already part of your planning workflow", checked: true },
            
            // Health & Hygiene
            { id: 801, category: "Health & Hygiene", name: "Blister kit (Compeed) (small)", notes: "[Need to Buy] Non-negotiable for 22 consecutive days", checked: false },
            { id: 802, category: "Health & Hygiene", name: "Leukotape (1 roll)", notes: "[Need to Buy] Preventative taping for hot spots", checked: false },
            { id: 803, category: "Health & Hygiene", name: "Personal first aid + meds (small kit)", notes: "[Need to Buy]", checked: false },
            { id: 804, category: "Health & Hygiene", name: "Sunscreen, high SPF (1 small stick ~20g)", notes: "[Need to Buy] Long sleeves + buff + brimmed hat cover most skin, but face, ears, and hands stay exposed — scale down to a small stick rather than a full tube, don't skip it entirely", checked: false },
            { id: 805, category: "Health & Hygiene", name: "SPF lip balm (1)", notes: "[Need to Buy]", checked: false },
            { id: 806, category: "Health & Hygiene", name: "Quick-dry travel towel (1)", notes: "[Own]", checked: true },
            { id: 807, category: "Health & Hygiene", name: "Travel soap/wash (1 small)", notes: "[Need to Buy] Doubles as laundry soap for sink-washing socks/underwear", checked: false },
            { id: 808, category: "Health & Hygiene", name: "Toothbrush/toothpaste (travel size)", notes: "[Need to Buy]", checked: false },
            
            // Repair & Misc
            { id: 901, category: "Repair & Misc", name: "Gear repair tape (Tenacious Tape) (small strip)", notes: "[Need to Buy]", checked: false },
            { id: 902, category: "Repair & Misc", name: "Spare trekking pole tip (1)", notes: "[Need to Buy]", checked: false },
            { id: 903, category: "Repair & Misc", name: "Mountain Hardwear poles (1 pair)", notes: "[Own]", checked: true },
            { id: 904, category: "Repair & Misc", name: "Small ziplock/stuff bags (a few)", notes: "[Need to Buy] Organization, keeps wet/dry separated", checked: false },
            
            // Documents & Money
            { id: 1001, category: "Documents & Money", name: "ID / passport", notes: "[Own] (assumed)", checked: true },
            { id: 1002, category: "Documents & Money", name: "Accommodation confirmations", notes: "[Own] Already booked per your stage planner", checked: true },
            { id: 1003, category: "Documents & Money", name: "Cash (CHF)", notes: "[Need to Buy] Many huts are cash-only", checked: false },
            { id: 1004, category: "Documents & Money", name: "Cards", notes: "[Own] (assumed)", checked: true }
        ];

        // UI Context Core State Tracker Variables
        let currentUser = 'rishi';
        let currentFilter = 'all';
        let editingItemId = null;

        // Structured state data models storage keys
        let listData = JSON.parse(localStorage.getItem('sahani_via_alpina_v3_data'));
        
        // Handle database forward migrations cleanly if older version records exist
        if (!listData) {
            const olderData = JSON.parse(localStorage.getItem('sahani_via_alpina_v2_data')) || JSON.parse(localStorage.getItem('sahani_via_alpina_dual_data'));
            if (olderData) {
                listData = {
                    rishi: olderData.rishi || olderData.me || JSON.parse(JSON.stringify(initialDefaultItems)),
                    marion: olderData.marion || olderData.wife || JSON.parse(JSON.stringify(initialDefaultItems)),
                };
            } else {
                listData = {
                    rishi: JSON.parse(JSON.stringify(initialDefaultItems)),
                    marion: JSON.parse(JSON.stringify(initialDefaultItems)),
                };
            }
            localStorage.setItem('sahani_via_alpina_v3_data', JSON.stringify(listData));
        }

        // Available application category block definition map
        const categoriesList = [
            "Footwear", "Lower Body Clothing", "Upper Body & Insulation", 
            "Head, Hands, Accessories", "Sleep System", "Pack & Hydration", 
            "Navigation & Electronics", "Health & Hygiene", "Repair & Misc", "Documents & Money"
        ];

        // Collapsible configuration track index — DEFAULT: All collapsed on load layout
        let collapsedCategories = JSON.parse(localStorage.getItem('sahani_collapsed_cats_v3'));
        if (!collapsedCategories) {
            collapsedCategories = {};
            categoriesList.forEach(cat => {
                collapsedCategories[cat] = true; 
            });
            localStorage.setItem('sahani_collapsed_cats_v3', JSON.stringify(collapsedCategories));
        }

        function saveToStorage() {
            localStorage.setItem('sahani_via_alpina_v3_data', JSON.stringify(listData));
            updateCounter();
        }

        function linkifyText(text) {
            if (!text) return "";
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, function(url) {
                return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
            });
        }

        function updateCounter() {
            const activeItems = listData[currentUser];
            const completed = activeItems.filter(i => i.checked).length;
            document.getElementById('listCounter').textContent = `${completed} / ${activeItems.length} Packed`;
            document.getElementById('activeProfileLabel').textContent = `${currentUser === 'rishi' ? "Rishi's" : "Marion's"} Packing List`;
        }

        function switchUser(user) {
            currentUser = user;
            editingItemId = null;
            
            document.getElementById('prof-rishi').classList.toggle('active', user === 'rishi');
            document.getElementById('prof-marion').classList.toggle('active', user === 'marion');
            
            updateCounter();
            renderList();
        }

        function switchFilter(filter) {
            currentFilter = filter;
            
            document.getElementById('filter-all').classList.toggle('active', filter === 'all');
            document.getElementById('filter-ready').classList.toggle('active', filter === 'ready');
            document.getElementById('filter-tobuy').classList.toggle('active', filter === 'tobuy');
            
            renderList();
        }

        function toggleCategoryCollapse(catName) {
            collapsedCategories[catName] = !collapsedCategories[catName];
            localStorage.setItem('sahani_collapsed_cats_v3', JSON.stringify(collapsedCategories));
            renderList();
        }

        function setAllCollapseState(collapseBool) {
            categoriesList.forEach(cat => {
                collapsedCategories[cat] = collapseBool;
            });
            localStorage.setItem('sahani_collapsed_cats_v3', JSON.stringify(collapsedCategories));
            renderList();
        }

        /* Modal Toggle Handlers */
        function openAddItemModal() {
            document.getElementById('addItemModal').style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Lock background scrolling
        }

        function closeAddItemModal() {
            document.getElementById('addItemModal').style.display = 'none';
            document.body.style.overflow = '';
        }

        function closeAddItemModalOutside(event) {
            if (event.target.id === 'addItemModal') {
                closeAddItemModal();
            }
        }

        function resetToDefaults() {
            if (confirm("This will completely flush your tracker data cache and reset to baseline categories. Any custom entries will be lost. Proceed?")) {
                localStorage.removeItem('sahani_via_alpina_v3_data');
                localStorage.removeItem('sahani_via_alpina_v2_data');
                localStorage.removeItem('sahani_via_alpina_dual_data');
                localStorage.removeItem('sahani_collapsed_cats_v3');
                window.location.reload();
            }
        }

        function addItem() {
            const nameInput = document.getElementById('newItemName');
            const catSelect = document.getElementById('newItemCategory');
            const notesInput = document.getElementById('newItemNotes');

            if (!nameInput.value.trim()) return alert("Please enter an item name.");

            const newItem = {
                id: Date.now(),
                category: catSelect.value,
                name: nameInput.value.trim(),
                notes: notesInput.value.trim(),
                checked: false,
            };

            listData[currentUser].push(newItem);
            nameInput.value = "";
            notesInput.value = "";
            
            saveToStorage();
            renderList();
            closeAddItemModal();
        }

        function toggleItemCheck(id) {
            listData[currentUser] = listData[currentUser].map(item => {
                if (item.id === id) {
                    return { ...item, checked: !item.checked };
                }
                return item;
            });
            saveToStorage();
            renderList();
        }

        function startInlineEdit(id, event) {
            event.stopPropagation();
            editingItemId = id;
            renderList();
        }

        function cancelEdit(event) {
            event.stopPropagation();
            editingItemId = null; 
            renderList();
        }

        function saveInlineEdit(id, event) {
            event.stopPropagation();
            const editName = document.getElementById(`editName-${id}`).value.trim();
            const editNotes = document.getElementById(`editNotes-${id}`).value.trim();

            if (!editName) return alert("Item name cannot be blank.");

            listData[currentUser] = listData[currentUser].map(item => {
                if (item.id === id) {
                    return { ...item, name: editName, notes: editNotes };
                }
                return item;
            });

            editingItemId = null;
            saveToStorage();
            renderList();
        }

        function deleteItem(id, event) {
            event.stopPropagation();
            if (confirm("Are you sure you want to delete this item?")) {
                listData[currentUser] = listData[currentUser].filter(item => item.id !== id);
                if (editingItemId === id) editingItemId = null;
                saveToStorage();
                renderList();
            }
        }

        function exportState() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(listData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `via-alpina-packing-backup.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importState(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    let importedData = {};
                    
                    if (parsed.rishi || parsed.marion) {
                        importedData.rishi = parsed.rishi || JSON.parse(JSON.stringify(initialDefaultItems));
                        importedData.marion = parsed.marion || JSON.parse(JSON.stringify(initialDefaultItems));
                    } else if (parsed.me || parsed.wife) {
                        importedData.rishi = parsed.me || JSON.parse(JSON.stringify(initialDefaultItems));
                        importedData.marion = parsed.wife || JSON.parse(JSON.stringify(initialDefaultItems));
                    } else {
                        throw new Error("Invalid format matrix template paths.");
                    }

                    listData = importedData;
                    saveToStorage();
                    renderList();
                    updateCounter();
                    closeAddItemModal();
                    alert("Import successful! Data synchronized successfully.");
                } catch (err) {
                    alert("Failed to parse file. Make sure it's a valid backup tracking JSON.");
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function renderList() {
            const container = document.getElementById('itemsContainer');
            container.innerHTML = "";

            const activeItems = listData[currentUser];

            categoriesList.forEach(catName => {
                const allCatItems = activeItems.filter(item => (item.category || "Footwear") === catName);
                if (allCatItems.length === 0) return; 

                const readyCount = allCatItems.filter(i => i.checked).length;
                const totalCount = allCatItems.length;
                const progressPercent = totalCount > 0 ? (readyCount / totalCount) * 100 : 0;

                const filteredCatItems = allCatItems.filter(item => {
                    if (currentFilter === 'ready') return item.checked;
                    if (currentFilter === 'tobuy') return !item.checked;
                    return true;
                });

                if (filteredCatItems.length === 0) return;

                const isCollapsed = !!collapsedCategories[catName];

                const catSection = document.createElement('div');
                catSection.className = "category-section";

                catSection.innerHTML = `
                    <div class="category-header" onclick="toggleCategoryCollapse('${catName}')">
                        <div class="category-header-top">
                            <span class="category-title">
                                <span class="category-icon-width">
                                    <i class="fa-solid ${isCollapsed ? 'fa-chevron-right' : 'fa-chevron-down'}"></i>
                                </span> 
                                ${catName}
                            </span>
                            <span class="badge badge-neutral" style="font-size: 11px;">
                                ${readyCount} / ${totalCount} Ready
                            </span>
                        </div>
                        <div class="category-progress-container">
                            <div class="category-progress-bar" style="width: ${progressPercent}%;"></div>
                        </div>
                    </div>
                    <div class="category-items-container" style="display: ${isCollapsed ? 'none' : 'block'}; margin-top: 8px; padding-left: 4px;">
                    </div>
                `;

                const itemsTarget = catSection.querySelector('.category-items-container');

                filteredCatItems.forEach(item => {
                    if (item.id === editingItemId) {
                        // Edit Layout Mode
                        const editCard = document.createElement('div');
                        editCard.className = "card";
                        editCard.style.marginBottom = "8px";
                        editCard.innerHTML = `
                            <div class="sec-lbl" style="color: var(--app-accent); font-size: 11px;">Editing Item Details</div>
                            <div style="display: flex; flex-direction: column; gap: 8px;">
                                <div>
                                    <label class="sec-lbl" style="font-size: 9px; display:block; margin-bottom:2px;">Item Name</label>
                                    <input type="text" id="editName-${item.id}" class="input-field" value="${item.name}">
                                </div>
                                <div style="margin-bottom: var(--sp-2);">
                                    <label class="sec-lbl" style="font-size: 9px; display:block; margin-bottom:2px;">Notes & Links</label>
                                    <textarea id="editNotes-${item.id}" class="input-field" style="resize: vertical; min-height: 60px;">${item.notes || ''}</textarea>
                                </div>
                            </div>
                            <div class="flex-between" style="gap: 8px;">
                                <button onclick="deleteItem(${item.id}, event)" class="btn btn-danger"><i class="fa-solid fa-trash-can"></i> Delete</button>
                                <div class="flex gap-2">
                                    <button onclick="cancelEdit(event)" class="btn btn-secondary"><i class="fa-solid fa-xmark"></i> Cancel</button>
                                    <button onclick="saveInlineEdit(${item.id}, event)" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save</button>
                                </div>
                            </div>
                        `;
                        itemsTarget.appendChild(editCard);
                    } else {
                        // Standard List Row Layout
                        const itemWrap = document.createElement('div');
                        itemWrap.className = "row-item card";
                        itemWrap.style.padding = "10px 12px";
                        itemWrap.style.marginBottom = "6px";

                        itemWrap.innerHTML = `
                            <div class="ri-header-mobile">
                                <div class="ri-left-mobile">
                                    <input type="checkbox" class="item-checkbox" ${item.checked ? 'checked' : ''} onchange="toggleItemCheck(${item.id})">
                                    <span class="ri-name-mobile ${item.checked ? 'item-checked-text' : ''}" style="font-size: var(--t-base);">
                                        ${item.name}
                                    </span>
                                </div>
                                <button onclick="startInlineEdit(${item.id}, event)" class="btn btn-secondary" style="padding: 4px 8px; font-size: 11px; margin-top: -2px;"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                            </div>
                            ${item.notes ? `
                                <div class="db-body" style="margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border2); color: var(--muted); font-size: 13px; word-break: break-word; overflow-wrap: anywhere; line-height: 1.4;">
                                    ${linkifyText(item.notes)}
                                </div>
                            ` : ''}
                        `;
                        itemsTarget.appendChild(itemWrap);
                    }
                });

                container.appendChild(catSection);
            });

            if (container.children.length === 0) {
                container.innerHTML = `<div class="notice notice-info"><div class="notice-body">No packing tracker items found matching the selected filters.</div></div>`;
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            updateCounter();
            renderList();
        });
    </script>
</body>
</html>
