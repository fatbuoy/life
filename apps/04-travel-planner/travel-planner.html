<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Wanderer — Travel</title>
<link rel="icon" href="https://api.iconify.design/mdi:airplane.svg?color=%235040c0" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/base.css">
<style>
:root {
  --app-primary:       #1a1050;
  --app-primary2:      #231666;
  --app-primary3:      #3424a0;
  --app-accent:        #5040c0;
  --app-on-primary:    #ffffff;
  --app-on-primary2:   #c0b8f8;
  --app-on-primary3:   #8878e0;
}
body { background: #f1f5fa }

.year-ctrl { display:flex; align-items:center; gap:4px; background:rgba(255,255,255,.1); border-radius:var(--r-pill); padding:2px 6px }
.year-ctrl button { background:none; border:none; color:var(--app-on-primary2); font-size:15px; line-height:1; cursor:pointer; padding:0 4px; -webkit-tap-highlight-color:transparent }
.year-ctrl span { font-size:12px; font-weight:700; color:var(--app-on-primary); min-width:36px; text-align:center }

/* Calendar */
.cal-year-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px }
@media (min-width:600px) { .cal-year-grid { grid-template-columns:repeat(3,1fr); gap:10px } }
@media (min-width:900px) { .cal-year-grid { grid-template-columns:repeat(4,1fr); gap:12px } }

.cal-month { background:var(--white); border:1px solid var(--border); border-radius:var(--r-lg); overflow:hidden }
.cal-month-hdr { background:var(--app-primary); color:var(--app-on-primary); padding:6px 8px; font-size:10px; font-weight:800; text-align:center; text-transform:uppercase; letter-spacing:.06em }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; padding:6px }
.cal-day { aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:600; border-radius:4px }
.cal-day.trip { color:white; cursor:pointer; font-weight:800 }
.cal-day.today { outline:2px solid var(--app-accent); outline-offset:-1px }

/* Trips — mobile cards, desktop table */
.trips-list { display:flex; flex-direction:column; gap:8px }
.trip-row-card {
  background:var(--white); border:1px solid var(--border); border-radius:var(--r-lg); padding:12px 14px;
  border-left:4px solid var(--chip-color,var(--app-accent));
  display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
  -webkit-tap-highlight-color:transparent; transition:box-shadow .15s
}
.trip-row-card:hover { box-shadow:0 2px 12px rgba(0,0,0,.06) }
.trc-dest  { font-size:13px; font-weight:800; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.trc-dates { font-size:10px; color:var(--muted); margin-top:3px }
.trc-type  { font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; margin-top:5px; color:var(--chip-color,var(--app-accent)) }
.trc-right { flex-shrink:0; text-align:right }

@media (min-width:860px) { .trips-list { display:none } .trips-table-wrap { display:block } }
.trips-table-wrap { display:none }
.trips-table-wrap table { width:100%; border-collapse:collapse; background:var(--white); border-radius:var(--r-lg); overflow:hidden; border:1px solid var(--border) }
.trips-table-wrap thead { background:var(--app-primary); color:var(--app-on-primary) }
.trips-table-wrap th { padding:10px 14px; font-size:10px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; text-align:left }
.trips-table-wrap td { padding:11px 14px; font-size:12px; border-bottom:1px solid var(--border2); vertical-align:middle }
.trips-table-wrap tr:last-child td { border-bottom:none }
.trips-table-wrap tr:hover td { background:var(--surface) }

/* Budget cards */
.budget-grid { display:grid; grid-template-columns:1fr; gap:10px }
@media (min-width:600px) { .budget-grid { grid-template-columns:1fr 1fr } }
@media (min-width:900px) { .budget-grid { grid-template-columns:repeat(3,1fr) } }

.budget-card { background:var(--white); border:1px solid var(--border); border-radius:var(--r-lg); overflow:hidden; transition:box-shadow .15s }
.budget-card:hover { box-shadow:0 4px 12px rgba(0,0,0,.06) }
.bc-head { padding:10px 14px 9px; border-bottom:1px solid var(--border2); display:flex; align-items:center; justify-content:space-between }
.bc-title { font-size:12px; font-weight:800; color:var(--text); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.bc-body { padding:12px 14px }
.bc-amounts { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:10px }
.bc-amt-val { font-size:20px; font-weight:900; letter-spacing:-0.5px; line-height:1 }
.bc-amt-lbl { font-size:9px; text-transform:uppercase; color:var(--muted); font-weight:700; margin-top:2px; letter-spacing:.05em }
.bc-bar-track { height:6px; background:var(--border2); border-radius:99px; overflow:hidden }
.bc-bar-fill  { height:100%; border-radius:99px; transition:width .4s ease }
</style>
</head>
<body>

<header class="header">
  <div class="container">
    <div class="header-row">
      <div class="header-left">
        <a class="header-home" href="../../index.html">⌂</a>
        <span class="header-title">Wanderer</span>
      </div>
      <div class="header-right">
        <div class="year-ctrl">
          <button onclick="changeYear(-1)">‹</button>
          <span id="yearLabel">2026</span>
          <button onclick="changeYear(1)">›</button>
        </div>
        <span class="header-badge" id="tripBadge">—</span>
      </div>
    </div>
  </div>
</header>

<nav class="app-nav">
  <button class="nav-btn active" onclick="showTab('calendar',this)">📅 Calendar</button>
  <button class="nav-btn" onclick="showTab('trips',this)">🗺 Trips</button>
  <button class="nav-btn" onclick="showTab('budget',this)">💰 Budget</button>
</nav>

<main style="padding-bottom:40px">
  <div class="container">

    <div class="tab-panel active" id="tab-calendar">
      <div class="trip-strip" id="upcomingStrip"></div>
      <div class="cal-year-grid" id="calGrid"></div>
    </div>

    <div class="tab-panel" id="tab-trips">
      <div class="trips-list" id="tripsList"></div>
      <div class="trips-table-wrap">
        <table>
          <thead>
            <tr>
              <th>Type</th><th>Destination</th>
              <th>From</th><th>To</th><th>Status</th>
              <th style="text-align:right">Budget CHF</th>
            </tr>
          </thead>
          <tbody id="tripsTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="tab-panel" id="tab-budget">
      <div class="budget-grid" id="budgetCards"></div>
    </div>

  </div>
</main>

<script src="../../shared/utils.js"></script>
<script>
let DATA = null;
let currentYear = 2026;

const TYPE_META = {
  leisure:     { label:'Leisure',      colour:'#29b6f6', icon:'🏖' },
  race:        { label:'Race',         colour:'#ef5350', icon:'🏅' },
  active:      { label:'Active',       colour:'#4caf50', icon:'🏃' },
  work:        { label:'Work',         colour:'#9e9e9e', icon:'💼' },
  family:      { label:'Family',       colour:'#ab47bc', icon:'👪' },
  bikepacking: { label:'Bikepacking',  colour:'#8d6e63', icon:'🚵' },
};
const tc = t => TYPE_META[t]?.colour || '#888';
const ti = t => TYPE_META[t]?.icon   || '📍';
const tl = t => TYPE_META[t]?.label  || t;

function fmtDate(str) {
  if (!str) return '—';
  return new Date(str + 'T00:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short' });
}

async function loadData() {
  DATA = await fetchData('../../data/travel.json');
  if (!DATA) return;
  render();
}

function render() {
  document.getElementById('yearLabel').textContent = currentYear;
  const trips = DATA.trips.filter(t => !t._comment);
  document.getElementById('tripBadge').textContent =
    trips.filter(t => t.startDate?.startsWith(String(currentYear))).length + ' trips';
  renderUpcomingStrip(trips);
  renderCalendar(trips);
  renderTripsTab(trips);
  renderBudgetTab(trips);
}

function renderUpcomingStrip(trips) {
  const el = document.getElementById('upcomingStrip');
  const today = new Date().toISOString().slice(0,10);
  const horizon = new Date(Date.now() + 120*86400000).toISOString().slice(0,10);
  const upcoming = trips
    .filter(t => t.endDate >= today && t.startDate <= horizon)
    .sort((a,b) => a.startDate.localeCompare(b.startDate));

  if (!upcoming.length) {
    el.innerHTML = `<p style="color:var(--muted);font-size:12px;padding:4px 0 14px">No trips in the next 120 days</p>`;
    return;
  }
  el.innerHTML = upcoming.map(t => {
    const days  = daysUntil(t.startDate);
    const col   = tc(t.type);
    const isNow = days <= 0 && daysUntil(t.endDate) >= 0;
    return `
      <div class="trip-chip" style="--chip-color:${col}">
        <div class="tc-days">${isNow ? '✈' : days}</div>
        <div class="tc-days-lbl">${isNow ? 'Active now' : 'days away'}</div>
        <div class="tc-dest">${t.destination}</div>
        <div class="tc-dates">${fmtDate(t.startDate)} – ${fmtDate(t.endDate)}</div>
        <div class="tc-type-pill">${ti(t.type)} ${tl(t.type)}</div>
      </div>`;
  }).join('');
}

function renderCalendar(trips) {
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const todayStr = new Date().toISOString().slice(0,10);

  for (let m = 0; m < 12; m++) {
    const wrap = document.createElement('div');
    wrap.className = 'cal-month';
    const hdr = document.createElement('div');
    hdr.className = 'cal-month-hdr';
    hdr.textContent = months[m];
    wrap.appendChild(hdr);

    const inner = document.createElement('div');
    inner.className = 'cal-grid';
    const days = new Date(currentYear, m + 1, 0).getDate();

    for (let d = 1; d <= days; d++) {
      const ds = `${currentYear}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const trip = trips.find(t => ds >= t.startDate && ds <= t.endDate);
      const el = document.createElement('div');
      el.className = 'cal-day' + (trip ? ' trip' : '') + (ds === todayStr ? ' today' : '');
      el.textContent = d;
      if (trip) el.style.backgroundColor = tc(trip.type);
      inner.appendChild(el);
    }
    wrap.appendChild(inner);
    grid.appendChild(wrap);
  }
}

function renderTripsTab(trips) {
  const sorted = [...trips].sort((a,b) => a.startDate.localeCompare(b.startDate));

  document.getElementById('tripsList').innerHTML = sorted.map(t => `
    <div class="trip-row-card" style="--chip-color:${tc(t.type)}">
      <div style="flex:1;min-width:0">
        <div class="trc-dest">${ti(t.type)} ${t.destination}</div>
        <div class="trc-dates">${fmtDate(t.startDate)} – ${fmtDate(t.endDate)}</div>
        <div class="trc-type">${tl(t.type)}</div>
      </div>
      <div class="trc-right">
        <span class="status-pill status-${(t.status||'').toLowerCase()}">${t.status||'—'}</span>
        ${t.budgetEstimate ? `<div style="font-size:11px;color:var(--muted);margin-top:6px">CHF ${fmt(t.budgetEstimate)}</div>` : ''}
      </div>
    </div>`).join('');

  document.getElementById('tripsTableBody').innerHTML = sorted.map(t => `
    <tr>
      <td style="font-weight:800;color:${tc(t.type)}">${ti(t.type)} ${tl(t.type)}</td>
      <td style="font-weight:700">${t.destination}</td>
      <td>${fmtDate(t.startDate)}</td>
      <td>${fmtDate(t.endDate)}</td>
      <td><span class="status-pill status-${(t.status||'').toLowerCase()}">${t.status||'—'}</span></td>
      <td style="text-align:right;color:var(--muted)">${t.budgetEstimate ? fmt(t.budgetEstimate) : '—'}</td>
    </tr>`).join('');
}

function renderBudgetTab(trips) {
  const withBudget = trips.filter(t => t.budgetEstimate);
  document.getElementById('budgetCards').innerHTML = withBudget.map(t => {
    const spent  = t.budgetActual || 0;
    const budget = t.budgetEstimate;
    const pct    = Math.min((spent / budget) * 100, 100);
    const over   = spent > budget;
    const barCol = over ? 'var(--c-danger)' : pct > 80 ? 'var(--c-warning)' : 'var(--c-success)';
    const col    = tc(t.type);
    return `
      <div class="budget-card">
        <div class="bc-head" style="border-left:4px solid ${col};padding-left:10px">
          <div class="bc-title">${ti(t.type)} ${t.destination}</div>
          <span class="bc-status"><span class="status-pill status-${(t.status||'').toLowerCase()}">${t.status||'—'}</span></span>
        </div>
        <div class="bc-body">
          <div class="bc-amounts">
            <div>
              <div class="bc-amt-val" style="color:${barCol}">CHF ${fmt(spent)}</div>
              <div class="bc-amt-lbl">Spent</div>
            </div>
            <div style="text-align:right">
              <div class="bc-amt-val" style="color:var(--text)">CHF ${fmt(budget)}</div>
              <div class="bc-amt-lbl">Budget</div>
            </div>
          </div>
          <div class="bc-bar-track">
            <div class="bc-bar-fill" style="width:${pct}%;background:${barCol}"></div>
          </div>
          ${over   ? `<div style="font-size:10px;color:var(--c-danger);margin-top:6px;font-weight:700">CHF ${fmt(spent-budget)} over</div>` : ''}
          ${!spent ? `<div style="font-size:10px;color:var(--muted);margin-top:6px">No actuals recorded</div>` : ''}
        </div>
      </div>`;
  }).join('');
}

function showTab(id, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
}

function changeYear(n) { currentYear += n; render(); }

document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
