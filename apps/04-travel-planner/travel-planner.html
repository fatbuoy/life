<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sahani Wanderer</title>
<link rel="stylesheet" href="../../shared/base.css">
<style>
/* ── Wanderer app theme: deep indigo ── */
:root {
  --app-primary:    #1a1050;
  --app-primary2:   #2a1a80;
  --app-primary3:   #4030a0;
  --app-accent:     #5040c0;
  --app-accent2:    #6050d0;
  --app-on-primary:    #ffffff;
  --app-on-primary2:   #b8b0f0;
  --app-on-primary3:   #8878d0;

  /* trip type colours — matching Excel legend */
  --c-visitors:   #22c55e;
  --c-holiday:    #00bcd4;
  --c-leisure:    #29b6f6;
  --c-active:     #4caf50;
  --c-race:       #ef5350;
  --c-work:       #9e9e9e;
  --c-swiss:      #ef5350;
  --c-anniversary:#e91e63;
  --c-public:     #ff7043;
}

/* ── BASE LAYOUT ─────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg,#f2f4f7);color:var(--text,#1a2332);min-height:100vh;font-size:13px}

.app-shell{display:flex;flex-direction:column;min-height:100vh}

/* ── HEADER ─────────────────────────────────────────── */
.app-header{background:var(--app-primary);color:#fff;padding:0 16px;display:flex;align-items:center;gap:12px;height:48px;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.app-logo{font-size:18px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.app-logo span{color:var(--app-accent)}
.app-logo small{font-size:10px;font-weight:400;color:var(--app-on-primary2);letter-spacing:.1em;text-transform:uppercase;margin-left:6px}
.header-spacer{flex:1}
.year-ctrl{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border-radius:8px;padding:4px 8px}
.year-ctrl button{background:none;border:none;color:rgba(255,255,255,.7);cursor:pointer;font-size:14px;padding:0 4px;transition:color .15s}
.year-ctrl button:hover{color:#fff}
.year-ctrl span{font-size:13px;font-weight:600;color:#fff;min-width:36px;text-align:center}
.home-btn{background:none;border:none;color:var(--app-on-primary2);cursor:pointer;font-size:11px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:4px;transition:color .15s;text-decoration:none}
.home-btn:hover{color:#fff}

/* ── NAV TABS ───────────────────────────────────────── */
.app-nav{background:var(--app-primary2);display:flex;gap:0;overflow-x:auto;border-bottom:1px solid rgba(255,255,255,.1)}
.nav-btn{background:none;border:none;border-bottom:3px solid transparent;padding:10px 16px;font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--app-on-primary3);cursor:pointer;white-space:nowrap;transition:all .15s;display:flex;align-items:center;gap:5px}
.nav-btn:hover{color:var(--app-on-primary)}
.nav-btn.active{color:#fff;border-bottom-color:var(--app-accent)}

/* ── MAIN CONTENT ───────────────────────────────────── */
.app-main{flex:1;padding:14px 14px 24px}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ── SECTION HEADING ────────────────────────────────── */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.sec-title{font-size:14px;font-weight:700;color:var(--app-primary);display:flex;align-items:center;gap:6px}
.sec-title .icon{font-size:16px}
.sec-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* ── BUTTONS ────────────────────────────────────────── */
.btn{font-family:inherit;font-size:11px;font-weight:600;border-radius:7px;padding:5px 12px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:4px;letter-spacing:.03em;border:1.5px solid transparent}
.btn-primary{background:var(--app-primary);color:#fff;border-color:var(--app-primary)}
.btn-primary:hover{background:var(--app-primary2)}
.btn-accent{background:var(--app-accent);color:#fff;border-color:var(--app-accent)}
.btn-accent:hover{background:var(--app-accent2)}
.btn-ghost{background:transparent;color:var(--app-primary2);border-color:var(--border,#dde1e7)}
.btn-ghost:hover{background:var(--surface,#f8f9fb);border-color:var(--app-primary3)}
.btn-sm{font-size:10px;padding:3px 8px;border-radius:5px}
.btn-danger{background:#fee2e2;color:#b91c1c;border-color:#fca5a5}
.btn-danger:hover{background:#fecaca}

/* ── LEGEND ─────────────────────────────────────────── */
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;background:var(--white,#fff);border:1px solid var(--border,#dde1e7);border-radius:10px;padding:8px 12px}
.legend-item{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--muted,#6b7280);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;transition:opacity .15s}
.legend-item:hover{opacity:.7}
.legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}

/* ── CALENDAR YEAR VIEW ─────────────────────────────── */
.cal-year-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.cal-year-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.cal-year-grid{grid-template-columns:repeat(2,1fr)}}

.cal-month{background:var(--white,#fff);border:1px solid var(--border,#dde1e7);border-radius:10px;overflow:hidden}
.cal-month-hdr{background:var(--app-primary);color:#fff;padding:6px 10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.cal-grid{padding:6px;display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.cal-dow{font-size:8.5px;font-weight:700;color:var(--faint,#9ca3af);text-align:center;padding:2px 0;text-transform:uppercase;letter-spacing:.04em}
.cal-day{height:22px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:500;color:var(--text,#1a2332);cursor:default;position:relative;transition:opacity .15s}
.cal-day.today{font-weight:800;color:var(--app-accent);box-shadow:inset 0 0 0 2px var(--app-accent)}
.cal-day.today::after{content:'';position:absolute;inset:1px;border-radius:3px;border:1.5px solid var(--app-accent);pointer-events:none}
.cal-day.trip{color:#fff;cursor:pointer}
.cal-day.trip:hover{opacity:.85;transform:scale(1.1)}
.cal-day.has-event{color:#fff;cursor:pointer}
.cal-day.sat,.cal-day.sun{color:var(--app-primary3)}
.cal-day.sat.trip,.cal-day.sun.trip,.cal-day.sat.has-event,.cal-day.sun.has-event{color:#fff}

/* ── TRIP LIST VIEW ─────────────────────────────────── */
.trip-table-wrap{background:var(--white,#fff);border:1px solid var(--border,#dde1e7);border-radius:10px;overflow:hidden}
.trip-table{width:100%;border-collapse:collapse}
.trip-table th{background:var(--app-primary);color:var(--app-on-primary2);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,.1)}
.trip-table td{padding:9px 12px;font-size:12px;border-bottom:1px solid var(--border,#dde1e7);vertical-align:middle}
.trip-table tr:last-child td{border-bottom:none}
.trip-table tr:hover td{background:var(--surface,#f8f9fb);cursor:pointer}
.trip-table tr.past td{opacity:.55}
.trip-row-type{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em;color:#fff}
.td-place{font-weight:600;color:var(--app-primary)}
.td-dates{font-size:11px;color:var(--muted,#6b7280);white-space:nowrap}
.td-nights{font-size:10px;color:var(--faint,#9ca3af);text-align:center}
.td-budget{font-size:11px;text-align:right}
.budget-ok{color:#16a34a}
.budget-warn{color:#d97706}
.budget-over{color:#dc2626}
.td-status{font-size:10px}
.status-planned{color:var(--app-primary3);font-weight:600}
.status-confirmed{color:#16a34a;font-weight:600}
.status-past{color:var(--faint,#9ca3af)}
.status-tbc{color:#d97706;font-weight:600}
.no-trips{padding:32px;text-align:center;color:var(--faint,#9ca3af);font-size:13px}

/* ── STATS ROW ──────────────────────────────────────── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:600px){.stats-row{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--white,#fff);border:1px solid var(--border,#dde1e7);border-radius:10px;padding:12px;text-align:center}
.stat-val{font-size:22px;font-weight:700;color:var(--app-primary);line-height:1}
.stat-val.accent{color:var(--app-accent)}
.stat-lbl{font-size:10px;color:var(--faint,#9ca3af);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}

/* ── TRIP DETAIL MODAL ──────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(10,37,64,.6);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(3px)}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--bg,#f2f4f7);border-radius:14px;max-width:700px;width:100%;max-height:92vh;overflow-y:auto;transform:scale(.96) translateY(12px);transition:transform .2s;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.modal-overlay.open .modal{transform:scale(1) translateY(0)}
.modal-close{position:absolute;top:12px;right:12px;width:30px;height:30px;background:rgba(0,0,0,.45);color:#fff;border:none;border-radius:50%;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;transition:background .15s}
.modal-close:hover{background:rgba(0,0,0,.7)}

.modal-hero{padding:18px 18px 14px;position:relative}
.modal-type-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:3px 9px;border-radius:5px;text-transform:uppercase;letter-spacing:.06em;color:#fff;margin-bottom:8px}
.modal-title{font-size:20px;font-weight:700;color:var(--app-primary);line-height:1.2;margin-bottom:3px}
.modal-subtitle{font-size:12px;color:var(--muted,#6b7280)}
.modal-dates-row{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.modal-date-item{display:flex;flex-direction:column}
.modal-date-lbl{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--faint,#9ca3af)}
.modal-date-val{font-size:13px;font-weight:600;color:var(--app-primary);margin-top:1px}

/* modal sections */
.modal-body{padding:0 14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:500px){.modal-body{grid-template-columns:1fr}}
.m-section{background:var(--white,#fff);border:1px solid var(--border,#dde1e7);border-radius:10px;overflow:hidden}
.m-section.full{grid-column:1/-1}
.m-sec-hdr{background:var(--app-primary2);padding:6px 12px;display:flex;align-items:center;justify-content:space-between}
.m-sec-lbl{font-size:9.5px;font-weight:600;color:var(--app-on-primary2);text-transform:uppercase;letter-spacing:.07em}
.m-sec-body{padding:10px 12px}
.m-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border,#dde1e7);font-size:11.5px}
.m-row:last-child{border-bottom:none}
.m-row-lbl{color:var(--muted,#6b7280)}
.m-row-val{font-weight:600;color:var(--app-primary);text-align:right}

/* budget mini-bar */
.budget-bar-wrap{margin-top:6px}
.budget-bar-track{height:6px;background:var(--border,#dde1e7);border-radius:3px;overflow:hidden;margin-bottom:4px}
.budget-bar-fill{height:100%;border-radius:3px;transition:width .4s ease}
.budget-bar-labels{display:flex;justify-content:space-between;font-size:9.5px}
.bbl-spent{color:var(--muted,#6b7280)}
.bbl-budget{color:var(--faint,#9ca3af)}

/* packing list */
.packing-list{list-style:none;padding:0}
.packing-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border,#dde1e7);font-size:11.5px;cursor:pointer;transition:background .1s}
.packing-item:last-child{border-bottom:none}
.packing-cb{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--border2,#c8cfd8);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.packing-item.checked .packing-cb{background:var(--app-primary);border-color:var(--app-primary)}
.packing-item.checked .packing-cb::after{content:'✓';font-size:9px;color:#fff;font-weight:700}
.packing-item.checked .packing-label{text-decoration:line-through;color:var(--faint,#9ca3af)}
.packing-label{flex:1}
.packing-cat{font-size:9px;color:var(--faint,#9ca3af);text-transform:uppercase;letter-spacing:.04em;margin-top:8px;margin-bottom:3px;font-weight:600}

/* confetti progress */
.packing-progress{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:11px;color:var(--muted,#6b7280)}
.packing-prog-track{flex:1;height:5px;background:var(--border,#dde1e7);border-radius:3px;overflow:hidden}
.packing-prog-fill{height:100%;background:var(--app-primary);border-radius:3px;transition:width .3s ease}

/* flight details */
.flight-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border,#dde1e7);font-size:11.5px}
.flight-row:last-child{border-bottom:none}
.flight-dir{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--faint,#9ca3af);min-width:40px}
.flight-time{font-weight:700;color:var(--app-primary);min-width:40px}
.flight-arrow{color:var(--app-accent);font-size:12px}
.flight-ref{font-size:10px;color:var(--muted,#6b7280);margin-left:auto;font-family:monospace}

/* countdown badge */
.countdown-badge{display:inline-flex;align-items:center;gap:5px;background:var(--app-accent);color:#fff;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.04em}
.countdown-badge.past{background:var(--app-primary3)}

/* notes textarea */
.notes-ta{width:100%;font-family:inherit;font-size:12px;color:var(--text,#1a2332);background:var(--surface,#f8f9fb);border:1px solid var(--border,#dde1e7);border-radius:6px;padding:8px;resize:vertical;min-height:70px;outline:none;transition:border-color .15s}
.notes-ta:focus{border-color:var(--app-primary3)}

/* ── BUDGET TAB ─────────────────────────────────────── */
.budget-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
@media(max-width:500px){.budget-summary{grid-template-columns:repeat(2,1fr)}}
.budget-trip-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.budget-card{background:var(--white,#fff);border:1px solid var(--border,#dde1e7);border-radius:10px;overflow:hidden;cursor:pointer;transition:box-shadow .15s}
.budget-card:hover{box-shadow:0 4px 16px rgba(10,37,64,.12)}
.bc-head{padding:10px 12px 8px;border-bottom:1px solid var(--border,#dde1e7)}
.bc-title{font-size:12px;font-weight:700;color:var(--app-primary);margin-bottom:2px}
.bc-sub{font-size:10px;color:var(--muted,#6b7280)}
.bc-body{padding:10px 12px}
.bc-amounts{display:flex;gap:12px;margin-bottom:8px}
.bc-amt{flex:1}
.bc-amt-val{font-size:16px;font-weight:700;line-height:1}
.bc-amt-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint,#9ca3af);margin-top:1px}
.bc-bar-track{height:7px;background:var(--border,#dde1e7);border-radius:4px;overflow:hidden}
.bc-bar-fill{height:100%;border-radius:4px;transition:width .4s ease}
.bc-variance{font-size:10px;font-weight:600;margin-top:5px;text-align:right}

/* ── PACKING TEMPLATES TAB ──────────────────────────── */
.template-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.template-card{background:var(--white,#fff);border:1px solid var(--border,#dde1e7);border-radius:10px;overflow:hidden}
.tc-head{padding:10px 12px 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border,#dde1e7)}
.tc-icon{font-size:20px}
.tc-title{font-size:12px;font-weight:700;color:var(--app-primary)}
.tc-count{font-size:10px;color:var(--faint,#9ca3af)}
.tc-body{padding:8px 12px;max-height:220px;overflow-y:auto}
.tc-cat{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint,#9ca3af);margin:6px 0 3px;padding-top:4px;border-top:1px solid var(--border,#dde1e7)}
.tc-cat:first-child{margin-top:0;border-top:none}
.tc-item{font-size:11px;color:var(--muted,#6b7280);padding:2px 0;display:flex;align-items:center;gap:5px}
.tc-item::before{content:'·';color:var(--border2,#c8cfd8)}

/* ── EMPTY / LOADING STATES ─────────────────────────── */
.empty-state{text-align:center;padding:48px 20px;color:var(--faint,#9ca3af)}
.empty-icon{font-size:40px;margin-bottom:10px}
.empty-msg{font-size:13px;margin-bottom:14px}

/* ── TOAST ──────────────────────────────────────────── */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--app-primary);color:#fff;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;z-index:2000;opacity:0;transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── UPCOMING STRIP ─────────────────────────────────── */
.upcoming-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scroll-snap-type:x mandatory}
.upcoming-card{flex-shrink:0;scroll-snap-align:start;background:var(--white,#fff);border:1px solid var(--border,#dde1e7);border-radius:10px;padding:10px 12px;width:180px;cursor:pointer;transition:box-shadow .15s;border-top:3px solid var(--app-primary)}
.upcoming-card:hover{box-shadow:0 4px 14px rgba(10,37,64,.12)}
.uc-days{font-size:22px;font-weight:800;color:var(--app-primary);line-height:1}
.uc-days-lbl{font-size:8.5px;color:var(--faint,#9ca3af);text-transform:uppercase;letter-spacing:.06em}
.uc-dest{font-size:12px;font-weight:700;color:var(--app-primary);margin-top:5px}
.uc-dates{font-size:10px;color:var(--muted,#6b7280)}
.uc-type{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}

/* ── ANIMATIONS ─────────────────────────────────────── */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .25s ease both}

</style>
</head>
<body>
<div class="app-shell">

<!-- ── HEADER ─────────────────────────────────────── -->
<header class="header">
  <div class="container">
    <div class="header-row">
      <div class="header-left">
        <a class="header-home" href="../../index.html">⌂</a>
        <span class="header-title">Wanderer</span>
      </div>
      <div class="header-right">
        <div class="year-ctrl">
          <button onclick="changeYear(-1)">‹</button>
          <span id="yearLabel">2026</span>
          <button onclick="changeYear(1)">›</button>
        </div>
        <span class="header-badge" id="tripBadge">—</span>
      </div>
    </div>
  </div>
</header>

<!-- ── NAV ────────────────────────────────────────── -->
<nav class="app-nav">
  <button class="nav-btn active" onclick="showTab('calendar',this)">📅 Calendar</button>
  <button class="nav-btn" onclick="showTab('trips',this)">🗺 Trips</button>
  <button class="nav-btn" onclick="showTab('budget',this)">💰 Budget</button>
  <button class="nav-btn" onclick="showTab('packing',this)">🎒 Packing Lists</button>
</nav>

<!-- ── MAIN ───────────────────────────────────────── -->
<main class="app-main">
<div class="container">

  <!-- ─ CALENDAR TAB ──────────────────────────────── -->
  <div class="tab-panel active" id="tab-calendar">
    <!-- upcoming strip -->
    <div id="upcomingStrip" class="upcoming-strip"></div>

    <!-- legend -->
    <div class="legend" id="legend"></div>

    <!-- year calendar -->
    <div class="cal-year-grid" id="calGrid"></div>
  </div>

  <!-- ─ TRIPS TAB ─────────────────────────────────── -->
  <div class="tab-panel" id="tab-trips">
    <div class="stats-row" id="tripsStats"></div>
    <div class="sec-head">
      <div class="sec-title"><span class="icon">🗺</span>All Trips</div>
      <div class="sec-actions">
        <select class="btn btn-ghost btn-sm" id="tripsYearFilter" onchange="renderTripsTab()">
          <option value="all">All Years</option>
        </select>
        <select class="btn btn-ghost btn-sm" id="tripsTypeFilter" onchange="renderTripsTab()">
          <option value="all">All Types</option>
        </select>
      </div>
    </div>
    <div class="trip-table-wrap">
      <table class="trip-table">
        <thead>
          <tr>
            <th>Type</th><th>Destination</th><th>Dates</th>
            <th style="text-align:center">Nights</th>
            <th>Status</th><th>Budget</th><th style="text-align:right">Actions</th>
          </tr>
        </thead>
        <tbody id="tripsTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- ─ BUDGET TAB ─────────────────────────────────── -->
  <div class="tab-panel" id="tab-budget">
    <div class="budget-summary stats-row" id="budgetStats"></div>
    <div class="sec-head">
      <div class="sec-title"><span class="icon">💰</span>Budget by Trip</div>
    </div>
    <div class="budget-trip-cards" id="budgetCards"></div>
  </div>

  <!-- ─ PACKING TAB ────────────────────────────────── -->
  <div class="tab-panel" id="tab-packing">
    <div class="sec-head">
      <div class="sec-title"><span class="icon">🎒</span>Packing List Templates</div>
      <p style="font-size:11px;color:var(--muted)">Templates apply automatically when you open a trip. Check items off in the trip detail view.</p>
    </div>
    <div class="template-grid" id="templateGrid"></div>
  </div>

</div><!-- /container -->

</div><!-- /app-shell -->

<!-- ── TRIP DETAIL MODAL ─────────────────────────── -->
<div class="modal-overlay" id="tripModal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<!-- ── TOAST ─────────────────────────────────────── -->
<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════════════
//  DATA LAYER
// ════════════════════════════════════════════════════

let DATA = null;         // loaded from travel.json
let currentYear = 2026;
let packingState = {};   // {tripId: {itemKey: bool}}

const TYPE_META = {
  'visitors':    { label:'Visitors',      colour:'#22c55e', icon:'👨‍👩‍👧' },
  'leisure':     { label:'Away - Leisure',colour:'#29b6f6', icon:'🏖' },
  'active':      { label:'Away - Active', colour:'#4caf50', icon:'🏃' },
  'race':        { label:'Race Day',      colour:'#ef5350', icon:'🏅' },
  'work':        { label:'Work',          colour:'#9e9e9e', icon:'💼' },
  'anniversary': { label:'Anniversary',   colour:'#e91e63', icon:'💕' },
  'holiday':     { label:'Holiday',       colour:'#00bcd4', icon:'🌍' },
  'bikepacking': { label:'Bikepacking',   colour:'#8d6e63', icon:'🚵' },
  'switzerland': { label:'Switzerland',   colour:'#ef5350', icon:'🇨🇭' },
  'family':      { label:'Family',        colour:'#ab47bc', icon:'👪' },
};

const MONTH_NAMES = ['January','February','March','April','May','June',
                     'July','August','September','October','November','December'];
const DOW = ['M','T','W','T','F','S','S'];

// ════════════════════════════════════════════════════
//  LOAD DATA
// ════════════════════════════════════════════════════

async function loadData() {
  try {
    // Use fetchData from utils.js if available, otherwise fall back to fetch()
    const raw = (typeof fetchData === 'function')
      ? await fetchData('../../data/travel.json')
      : await fetch('../../data/travel.json').then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); });
    if (!raw) throw new Error('No data returned');
    DATA = raw;
  } catch(e) {
    console.warn('Could not load travel.json — using demo data:', e.message);
    DATA = getDemoData();
  }
  // Restore packing state from localStorage
  try { packingState = JSON.parse(localStorage.getItem('wanderer_packing') || '{}'); } catch(_){}
  init();
}

// ════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════

function init() {
  currentYear = DATA.meta?.defaultYear || new Date().getFullYear();
  document.getElementById('yearLabel').textContent = currentYear;
  const count = (DATA.trips || []).length;
  document.getElementById('tripBadge').textContent = `${count} trip${count !== 1 ? 's' : ''}`;
  populateFilters();
  renderCalendar();
  renderUpcomingStrip();
  renderTripsTab();
  renderBudgetTab();
  renderPackingTemplates();
  renderLegend();
}

// ════════════════════════════════════════════════════
//  YEAR CONTROL
// ════════════════════════════════════════════════════

function changeYear(d) {
  currentYear += d;
  document.getElementById('yearLabel').textContent = currentYear;
  renderCalendar();
  renderUpcomingStrip();
}

// ════════════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════════════

function parseDate(s) { return s ? new Date(s + 'T00:00:00') : null; }

function fmt(dateStr, opts = {day:'numeric',month:'short'}) {
  const d = parseDate(dateStr);
  return d ? d.toLocaleDateString('en-GB', opts) : '—';
}

function nightsBetween(a, b) {
  const d1 = parseDate(a), d2 = parseDate(b);
  if(!d1||!d2) return 0;
  return Math.round((d2-d1)/(1000*60*60*24));
}

function isDateInRange(dateStr, start, end) {
  const d = parseDate(dateStr), s = parseDate(start), e = parseDate(end);
  if(!d||!s||!e) return false;
  return d >= s && d <= e;
}

function todayStr() {
  return new Date().toISOString().split('T')[0];
}

function daysUntil(dateStr) {
  const d = parseDate(dateStr);
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((d - today)/(1000*60*60*24));
}

function tripColour(trip) {
  return TYPE_META[trip.type]?.colour || '#666';
}

function budgetPct(trip) {
  if(!trip.budgetEstimate || !trip.budgetActual) return null;
  return Math.round((trip.budgetActual / trip.budgetEstimate) * 100);
}

function tripsForYear(year) {
  return (DATA.trips || []).filter(t => {
    const s = parseDate(t.startDate), e = parseDate(t.endDate);
    return (s && s.getFullYear() === year) || (e && e.getFullYear() === year);
  });
}

function upcomingTrips() {
  const today = todayStr();
  return (DATA.trips || [])
    .filter(t => t.endDate >= today)
    .sort((a,b) => a.startDate.localeCompare(b.startDate))
    .slice(0, 8);
}

// ════════════════════════════════════════════════════
//  LEGEND
// ════════════════════════════════════════════════════

function renderLegend() {
  const types = [...new Set((DATA.trips||[]).map(t=>t.type))];
  const el = document.getElementById('legend');
  el.innerHTML = types.map(type => {
    const m = TYPE_META[type] || {label:type, colour:'#999'};
    return `<div class="legend-item" title="Filter: ${m.label}">
      <div class="legend-dot" style="background:${m.colour}"></div>
      ${m.label}
    </div>`;
  }).join('');
}

// ════════════════════════════════════════════════════
//  UPCOMING STRIP
// ════════════════════════════════════════════════════

function renderUpcomingStrip() {
  const trips = upcomingTrips();
  const el = document.getElementById('upcomingStrip');
  if(!trips.length) { el.innerHTML=''; return; }
  el.innerHTML = trips.map(t => {
    const days = daysUntil(t.startDate);
    const colour = tripColour(t);
    const m = TYPE_META[t.type] || {};
    const inProgress = days <= 0 && daysUntil(t.endDate) >= 0;
    return `<div class="upcoming-card fade-up" style="border-top-color:${colour}" onclick="openTrip('${t.id}')">
      <div class="uc-days" style="color:${colour}">${inProgress ? '🌍' : days}</div>
      <div class="uc-days-lbl">${inProgress ? 'In Progress' : 'days away'}</div>
      <div class="uc-dest">${t.destination}</div>
      <div class="uc-dates">${fmt(t.startDate)} – ${fmt(t.endDate)}</div>
      <div class="uc-type" style="color:${colour}">${m.icon||''} ${m.label||t.type}</div>
    </div>`;
  }).join('');
}

// ════════════════════════════════════════════════════
//  CALENDAR
// ════════════════════════════════════════════════════

function renderCalendar() {
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  const trips = tripsForYear(currentYear);
  const today = todayStr();

  for(let m=0; m<12; m++) {
    const el = buildMonthEl(m, currentYear, trips, today);
    grid.appendChild(el);
  }
}

function buildMonthEl(monthIdx, year, trips, today) {
  const wrap = document.createElement('div');
  wrap.className = 'cal-month fade-up';
  wrap.style.animationDelay = (monthIdx * 0.04) + 's';

  const hdr = document.createElement('div');
  hdr.className = 'cal-month-hdr';
  hdr.textContent = MONTH_NAMES[monthIdx];
  wrap.appendChild(hdr);

  const grid = document.createElement('div');
  grid.className = 'cal-grid';

  // Day of week headers — Mon first
  DOW.forEach(d => {
    const dh = document.createElement('div');
    dh.className = 'cal-dow'; dh.textContent = d;
    grid.appendChild(dh);
  });

  // First day offset (Mon=0)
  const firstDay = new Date(year, monthIdx, 1);
  let offset = (firstDay.getDay() + 6) % 7; // 0=Mon
  for(let i=0;i<offset;i++) {
    const blank = document.createElement('div'); grid.appendChild(blank);
  }

  const daysInMonth = new Date(year, monthIdx+1, 0).getDate();
  for(let d=1; d<=daysInMonth; d++) {
    const dateStr = `${year}-${String(monthIdx+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayEl = document.createElement('div');
    dayEl.className = 'cal-day';

    // Determine day of week (0=Sun ... 6=Sat)
    const dow = new Date(year, monthIdx, d).getDay();
    if(dow===6) dayEl.classList.add('sat');
    if(dow===0) dayEl.classList.add('sun');
    if(dateStr === today) dayEl.classList.add('today');

    dayEl.textContent = d;

    // Check trips
    const matchTrip = trips.find(t => isDateInRange(dateStr, t.startDate, t.endDate));
    if(matchTrip) {
      dayEl.classList.add('trip');
      dayEl.style.background = tripColour(matchTrip);
      // Bold start/end
      if(dateStr===matchTrip.startDate || dateStr===matchTrip.endDate) {
        dayEl.style.opacity='1';
        dayEl.style.fontWeight='700';
      }
      dayEl.onclick = () => openTrip(matchTrip.id);
      dayEl.title = matchTrip.destination;
    }

    grid.appendChild(dayEl);
  }

  wrap.appendChild(grid);
  return wrap;
}

// ════════════════════════════════════════════════════
//  TRIPS TAB
// ════════════════════════════════════════════════════

function populateFilters() {
  const years = [...new Set((DATA.trips||[]).map(t=>parseDate(t.startDate)?.getFullYear()).filter(Boolean))].sort();
  const types = [...new Set((DATA.trips||[]).map(t=>t.type))];

  const yf = document.getElementById('tripsYearFilter');
  years.forEach(y => yf.innerHTML += `<option value="${y}">${y}</option>`);

  const tf = document.getElementById('tripsTypeFilter');
  types.forEach(t => {
    const m = TYPE_META[t]||{label:t};
    tf.innerHTML += `<option value="${t}">${m.label}</option>`;
  });
}

function renderTripsTab() {
  const today = todayStr();
  const yearF = document.getElementById('tripsYearFilter').value;
  const typeF = document.getElementById('tripsTypeFilter').value;

  let trips = DATA.trips || [];
  if(yearF !== 'all') trips = trips.filter(t => parseDate(t.startDate)?.getFullYear() == yearF);
  if(typeF !== 'all') trips = trips.filter(t => t.type === typeF);
  trips = trips.sort((a,b) => a.startDate.localeCompare(b.startDate));

  // Stats
  const total = trips.length;
  const upcoming = trips.filter(t=>t.startDate >= today).length;
  const totalBudget = trips.reduce((s,t)=>s+(t.budgetEstimate||0),0);
  const totalActual = trips.reduce((s,t)=>s+(t.budgetActual||0),0);

  document.getElementById('tripsStats').innerHTML = `
    <div class="stat-card"><div class="stat-val">${total}</div><div class="stat-lbl">Trips</div></div>
    <div class="stat-card"><div class="stat-val accent">${upcoming}</div><div class="stat-lbl">Upcoming</div></div>
    <div class="stat-card"><div class="stat-val">${trips.reduce((s,t)=>s+nightsBetween(t.startDate,t.endDate),0)}</div><div class="stat-lbl">Total Nights</div></div>
    <div class="stat-card"><div class="stat-val">${formatMoney(totalBudget)}</div><div class="stat-lbl">Total Budget</div></div>
  `;

  const tbody = document.getElementById('tripsTableBody');
  if(!trips.length) {
    tbody.innerHTML = `<tr><td colspan="7" class="no-trips">No trips found</td></tr>`;
    return;
  }

  tbody.innerHTML = trips.map(t => {
    const m = TYPE_META[t.type] || {label:t.type, colour:'#999'};
    const nights = nightsBetween(t.startDate, t.endDate);
    const isPast = t.endDate < today;
    const pct = budgetPct(t);
    let budgetHtml = '—';
    if(t.budgetEstimate) {
      const cls = pct===null?'':pct>110?'budget-over':pct>90?'budget-warn':'budget-ok';
      budgetHtml = `<div class="${cls}">${formatMoney(t.budgetActual||0)} / ${formatMoney(t.budgetEstimate)}</div>`;
    }
    const statusClass = `status-${(t.status||'planned').replace(/\s/g,'-').toLowerCase()}`;
    return `<tr class="${isPast?'past':''}" onclick="openTrip('${t.id}')">
      <td><span class="trip-row-type" style="background:${m.colour}">${m.icon||''} ${m.label}</span></td>
      <td class="td-place">${t.destination}</td>
      <td class="td-dates">${fmt(t.startDate)} – ${fmt(t.endDate)}</td>
      <td class="td-nights">${nights}</td>
      <td class="td-status"><span class="${statusClass}">${t.status||'Planned'}</span></td>
      <td class="td-budget">${budgetHtml}</td>
      <td style="text-align:right"><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openTrip('${t.id}')">View</button></td>
    </tr>`;
  }).join('');
}

// ════════════════════════════════════════════════════
//  BUDGET TAB
// ════════════════════════════════════════════════════

function renderBudgetTab() {
  const trips = (DATA.trips||[]).filter(t=>t.budgetEstimate);
  const totalBudget = trips.reduce((s,t)=>s+(t.budgetEstimate||0),0);
  const totalActual = trips.reduce((s,t)=>s+(t.budgetActual||0),0);
  const totalRemaining = totalBudget - totalActual;

  document.getElementById('budgetStats').innerHTML = `
    <div class="stat-card"><div class="stat-val">${formatMoney(totalBudget)}</div><div class="stat-lbl">Total Budgeted</div></div>
    <div class="stat-card"><div class="stat-val accent">${formatMoney(totalActual)}</div><div class="stat-lbl">Actual Spent</div></div>
    <div class="stat-card"><div class="stat-val ${totalRemaining<0?'budget-over':''}" style="${totalRemaining>=0?'color:#16a34a':''}">${formatMoney(Math.abs(totalRemaining))}</div><div class="stat-lbl">${totalRemaining>=0?'Remaining':'Over Budget'}</div></div>
  `;

  const cards = document.getElementById('budgetCards');
  if(!trips.length) {
    cards.innerHTML = `<div class="empty-state"><div class="empty-icon">💰</div><div class="empty-msg">No trips with budget data yet</div></div>`;
    return;
  }

  cards.innerHTML = trips.sort((a,b)=>a.startDate.localeCompare(b.startDate)).map(t => {
    const pct = t.budgetActual ? Math.min(Math.round((t.budgetActual/t.budgetEstimate)*100),100) : 0;
    const overPct = t.budgetActual ? Math.round((t.budgetActual/t.budgetEstimate)*100) : 0;
    const barColour = overPct > 110 ? '#dc2626' : overPct > 90 ? '#f59e0b' : '#16a34a';
    const m = TYPE_META[t.type]||{};
    const variance = t.budgetActual ? t.budgetEstimate - t.budgetActual : null;
    return `<div class="budget-card" onclick="openTrip('${t.id}')">
      <div class="bc-head">
        <div class="bc-title">${m.icon||''} ${t.destination}</div>
        <div class="bc-sub">${fmt(t.startDate)} · ${nightsBetween(t.startDate,t.endDate)} nights</div>
      </div>
      <div class="bc-body">
        <div class="bc-amounts">
          <div class="bc-amt">
            <div class="bc-amt-val" style="color:${barColour}">${formatMoney(t.budgetActual||0)}</div>
            <div class="bc-amt-lbl">Spent</div>
          </div>
          <div class="bc-amt">
            <div class="bc-amt-val" style="color:var(--muted)">${formatMoney(t.budgetEstimate)}</div>
            <div class="bc-amt-lbl">Budget</div>
          </div>
        </div>
        <div class="bc-bar-track"><div class="bc-bar-fill" style="width:${pct}%;background:${barColour}"></div></div>
        ${variance!==null ? `<div class="bc-variance" style="color:${variance>=0?'#16a34a':'#dc2626'}">${variance>=0?'Under':'Over'} by ${formatMoney(Math.abs(variance))}</div>` : '<div class="bc-variance" style="color:var(--faint)">Not yet tracked</div>'}
      </div>
    </div>`;
  }).join('');
}

// ════════════════════════════════════════════════════
//  PACKING TEMPLATES TAB
// ════════════════════════════════════════════════════

function renderPackingTemplates() {
  const templates = DATA.packingTemplates || [];
  const grid = document.getElementById('templateGrid');
  if(!templates.length) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-icon">🎒</div><div class="empty-msg">No templates in travel.json yet</div></div>`;
    return;
  }
  grid.innerHTML = templates.map(tmpl => {
    const m = TYPE_META[tmpl.type]||{};
    const totalItems = (tmpl.categories||[]).reduce((s,c)=>s+(c.items||[]).length,0);
    const catsHtml = (tmpl.categories||[]).map(cat => `
      <div class="tc-cat">${cat.name}</div>
      ${(cat.items||[]).map(item=>`<div class="tc-item">${item}</div>`).join('')}
    `).join('');
    return `<div class="template-card">
      <div class="tc-head">
        <div class="tc-icon">${m.icon||'📋'}</div>
        <div><div class="tc-title">${tmpl.label}</div><div class="tc-count">${totalItems} items</div></div>
      </div>
      <div class="tc-body">${catsHtml}</div>
    </div>`;
  }).join('');
}

// ════════════════════════════════════════════════════
//  TRIP DETAIL MODAL
// ════════════════════════════════════════════════════

function openTrip(id) {
  const trip = (DATA.trips||[]).find(t=>t.id===id);
  if(!trip) return;

  const m = TYPE_META[trip.type]||{label:trip.type,colour:'#666',icon:'🌍'};
  const nights = nightsBetween(trip.startDate, trip.endDate);
  const days = daysUntil(trip.startDate);
  const today = todayStr();
  const isPast = trip.endDate < today;
  const inProgress = trip.startDate <= today && trip.endDate >= today;
  const pct = budgetPct(trip);
  const barColour = pct===null?'#16a34a':pct>110?'#dc2626':pct>90?'#f59e0b':'#16a34a';

  // Get packing template for this trip type
  const template = (DATA.packingTemplates||[]).find(t=>t.type===trip.type) || (DATA.packingTemplates||[])[0];
  const tripPackState = packingState[id] || {};

  // Build packing list HTML
  let packingHtml = '';
  if(template) {
    const allItems = (template.categories||[]).flatMap(c=>(c.items||[]).map(item=>({cat:c.name,item})));
    const checkedCount = allItems.filter(({cat,item})=>tripPackState[cat+'::'+item]).length;
    const packPct = allItems.length ? Math.round((checkedCount/allItems.length)*100) : 0;
    packingHtml = `
      <div class="packing-progress">
        <div class="packing-prog-track"><div class="packing-prog-fill" id="packProg_${id}" style="width:${packPct}%"></div></div>
        <span id="packPct_${id}">${checkedCount}/${allItems.length} packed</span>
      </div>
      <ul class="packing-list" id="packList_${id}">
        ${(template.categories||[]).map(cat => `
          <li class="packing-cat">${cat.name}</li>
          ${(cat.items||[]).map(item => {
            const key = cat.name+'::'+item;
            const checked = tripPackState[key];
            return `<li class="packing-item${checked?' checked':''}" onclick="togglePack('${id}','${key.replace(/'/g,"\\'")}')">
              <div class="packing-cb"></div>
              <span class="packing-label">${item}</span>
            </li>`;
          }).join('')}
        `).join('')}
      </ul>`;
  } else {
    packingHtml = '<div style="color:var(--faint);font-size:11px">No packing template for this trip type</div>';
  }

  // Countdown badge
  let countdownHtml = '';
  if(inProgress) {
    countdownHtml = `<span class="countdown-badge">🌍 In progress · ${daysUntil(trip.endDate)+1} days left</span>`;
  } else if(!isPast) {
    countdownHtml = `<span class="countdown-badge">${days} days to go</span>`;
  } else {
    countdownHtml = `<span class="countdown-badge past">Completed</span>`;
  }

  // Flight details
  let flightsHtml = '';
  if(trip.flights && trip.flights.length) {
    flightsHtml = trip.flights.map(f=>`
      <div class="flight-row">
        <span class="flight-dir">${f.direction}</span>
        <span class="flight-time">${f.time}</span>
        <span class="flight-arrow">→</span>
        <span>${f.route}</span>
        <span class="flight-ref">${f.ref||''}</span>
      </div>`).join('');
  } else {
    flightsHtml = '<div style="color:var(--faint);font-size:11px">No flight details added yet</div>';
  }

  document.getElementById('modalContent').innerHTML = `
    <div class="modal-hero" style="border-top:4px solid ${m.colour}">
      <span class="modal-type-badge" style="background:${m.colour}">${m.icon} ${m.label}</span>
      ${countdownHtml}
      <div class="modal-title">${trip.destination}</div>
      <div class="modal-subtitle">${trip.description||''}</div>
      <div class="modal-dates-row">
        <div class="modal-date-item"><div class="modal-date-lbl">Departs</div><div class="modal-date-val">${fmt(trip.startDate,{weekday:'short',day:'numeric',month:'short'})}</div></div>
        <div class="modal-date-item"><div class="modal-date-lbl">Returns</div><div class="modal-date-val">${fmt(trip.endDate,{weekday:'short',day:'numeric',month:'short'})}</div></div>
        <div class="modal-date-item"><div class="modal-date-lbl">Nights</div><div class="modal-date-val">${nights}</div></div>
        <div class="modal-date-item"><div class="modal-date-lbl">Status</div><div class="modal-date-val">${trip.status||'Planned'}</div></div>
      </div>
    </div>

    <div class="modal-body">

      <!-- Logistics -->
      <div class="m-section">
        <div class="m-sec-hdr"><span class="m-sec-lbl">📋 Logistics</span></div>
        <div class="m-sec-body">
          <div class="m-row"><span class="m-row-lbl">Accommodation</span><span class="m-row-val">${trip.accommodation||'—'}</span></div>
          <div class="m-row"><span class="m-row-lbl">Who</span><span class="m-row-val">${trip.who||'—'}</span></div>
          <div class="m-row"><span class="m-row-lbl">Budget Tag</span><span class="m-row-val"><code>${trip.budgetTag||'—'}</code></span></div>
          ${trip.raceEventId?`<div class="m-row"><span class="m-row-lbl">Race Event</span><span class="m-row-val">🏅 ${trip.raceEventId}</span></div>`:''}
        </div>
      </div>

      <!-- Budget -->
      <div class="m-section">
        <div class="m-sec-hdr"><span class="m-sec-lbl">💰 Budget</span></div>
        <div class="m-sec-body">
          <div class="m-row"><span class="m-row-lbl">Estimate</span><span class="m-row-val">${formatMoney(trip.budgetEstimate||0)}</span></div>
          <div class="m-row"><span class="m-row-lbl">Actual</span><span class="m-row-val" style="color:${barColour}">${formatMoney(trip.budgetActual||0)}</span></div>
          ${trip.budgetEstimate?`
          <div class="budget-bar-wrap">
            <div class="budget-bar-track"><div class="budget-bar-fill" style="width:${Math.min(pct||0,100)}%;background:${barColour}"></div></div>
            <div class="budget-bar-labels">
              <span class="bbl-spent">${pct||0}% of budget</span>
              <span class="bbl-budget">${formatMoney(trip.budgetEstimate)}</span>
            </div>
          </div>`:'<div style="color:var(--faint);font-size:11px;margin-top:4px">No budget set</div>'}
        </div>
      </div>

      <!-- Flights -->
      <div class="m-section">
        <div class="m-sec-hdr"><span class="m-sec-lbl">✈ Flights</span></div>
        <div class="m-sec-body">${flightsHtml}</div>
      </div>

      <!-- Notes -->
      <div class="m-section">
        <div class="m-sec-hdr"><span class="m-sec-lbl">📝 Notes</span></div>
        <div class="m-sec-body">
          <textarea class="notes-ta" onchange="saveNotes('${id}',this.value)" placeholder="Add notes, ideas, must-sees…">${trip.notes||''}</textarea>
        </div>
      </div>

      <!-- Packing list — full width -->
      <div class="m-section full">
        <div class="m-sec-hdr">
          <span class="m-sec-lbl">🎒 Packing List</span>
          <button class="btn btn-ghost btn-sm" onclick="resetPacking('${id}')">Reset</button>
        </div>
        <div class="m-sec-body">${packingHtml}</div>
      </div>

    </div>
  `;

  document.getElementById('tripModal').classList.add('open');
}

function closeModal() {
  document.getElementById('tripModal').classList.remove('open');
}

// ════════════════════════════════════════════════════
//  PACKING INTERACTIONS
// ════════════════════════════════════════════════════

function togglePack(tripId, key) {
  if(!packingState[tripId]) packingState[tripId] = {};
  packingState[tripId][key] = !packingState[tripId][key];
  savePacking();
  // Update just the clicked item visually
  openTrip(tripId); // re-render modal (fast enough)
}

function resetPacking(tripId) {
  packingState[tripId] = {};
  savePacking();
  openTrip(tripId);
}

function savePacking() {
  try { localStorage.setItem('wanderer_packing', JSON.stringify(packingState)); } catch(_){}
}

function saveNotes(tripId, val) {
  const trip = (DATA.trips||[]).find(t=>t.id===tripId);
  if(trip) {
    trip.notes = val;
    toast('Notes saved locally');
  }
}

// ════════════════════════════════════════════════════
//  UI HELPERS
// ════════════════════════════════════════════════════

function showTab(name, btn) {
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  btn.classList.add('active');
}

function formatMoney(n) {
  if(!n && n!==0) return '—';
  const currency = DATA.meta?.currency || 'CHF';
  return currency + ' ' + Number(n).toLocaleString('en-GB',{minimumFractionDigits:0,maximumFractionDigits:0});
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2200);
}
