<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marathon du Jura - Training Planner</title>
<link rel="stylesheet" href="../../shared/base.css">
<style>
:root {
  --app-primary:    #1a2535;
  --app-primary2:   #2a3d55;
  --app-primary3:   #3a5575;
  --app-accent:     #d06020;
  --app-on-primary:    #ffffff;
  --app-on-primary2:   #b8cce0;
  --app-on-primary3:   #8aaac8;
}

.type-easy     { background:#e2f0d6; color:#27500a }
.type-tempo    { background:#faeeda; color:#633806 }
.type-long     { background:#deeaf7; color:#0c447c }
.type-interval { background:#fde8e8; color:#7c0c0c }
.type-race     { background:#2d0a6e; color:#d4c8ff }
.type-rest     { background:#f0ede8; color:#888 }
.type-cross    { background:#e0f5f0; color:#0a5040 }

.hero-status { background:var(--app-primary2); padding:16px; border-radius:10px; border:1px solid #444; margin-bottom:14px }
.hero-main { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:8px }
.hero-val { font-size:2rem; font-weight:900; color:var(--app-accent) }
.hero-target { font-size:0.9rem; color:var(--app-on-primary3) }
.progress-rail { height:12px; background:#333; border-radius:6px; overflow:hidden; position:relative; margin-bottom:10px }
.progress-fill { height:100%; background:linear-gradient(90deg, var(--app-accent), #2ecc71); transition:0.5s ease }
.hero-footer { display:flex; justify-content:space-between; font-size:0.75rem; color:var(--app-on-primary3); text-transform:uppercase; letter-spacing:1px }

.unit-toggle { font-size:0.7rem; border:1px solid var(--app-primary3); border-radius:20px; overflow:hidden; display:flex }
.u-btn { padding:4px 12px; cursor:pointer; background:#222; color:var(--app-on-primary3); }
.u-btn.active { background:var(--app-accent); color:white; }

.week-sect { background:var(--white); border-radius:10px; margin-bottom:8px; border:1px solid var(--border); overflow:hidden }
.week-header { padding:12px 15px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; background:#f5f5f5; transition:background 0.2s; user-select:none }
.week-header:hover { background:#efefef }
.week-header.active-week { border-left:4px solid var(--app-accent); background:#fafafa }
.week-title { font-size:0.9rem; font-weight:bold }
.week-summary { font-size:0.7rem; color:#999 }
.week-toggle { font-size:0.8rem; color:#666; width:20px; text-align:center; transition:transform 0.2s }
.week-toggle.open { transform:rotate(180deg) }

.week-content { display:none; max-height:0; overflow:hidden; transition:max-height 0.3s ease; padding:0 }
.week-content.open { display:block; padding:0 10px; max-height:2000px }

.day-row { display:flex; align-items:center; padding:12px 5px; border-bottom:1px solid #eee; gap:10px }
.day-row:last-child { border:none }
.day-checkbox { width:22px; height:22px; flex-shrink:0; cursor:pointer; accent-color:var(--app-accent) }
.date-box { width:50px; flex-shrink:0 }
.d-name { font-size:0.6rem; color:#999; display:block; text-transform:uppercase }
.d-num { font-size:0.9rem; font-weight:bold; color:var(--text) }

.workout-text { flex-grow:1; font-size:0.85rem }
.dist-bold { font-weight:800; color:#000 }
.completed { color:#999 !important; text-decoration:line-through }

.session-type { flex-shrink:0 }
.pill { display:inline-block; padding:2px 6px; border-radius:3px; font-size:9px; font-weight:600; white-space:nowrap }

.btn-reset { width:100%; padding:10px; background:transparent; color:#666; border:1px solid #ddd; border-radius:8px; margin-top:20px; font-size:0.8rem; cursor:pointer; transition:all 0.2s }
.btn-reset:hover { background:#f5f5f5 }

.accordion-controls { display:flex; gap:8px; margin-bottom:14px; justify-content:flex-end }
.accordion-btn { font-size:11px; font-weight:600; padding:6px 12px; border:1px solid var(--border); border-radius:6px; background:var(--white); cursor:pointer; transition:all 0.2s }
.accordion-btn:hover { background:var(--app-primary); color:var(--app-on-primary); border-color:var(--app-primary) }

.section-sep { height:1px; background:var(--border); margin:14px 0 }
</style>
</head>
<body>

<header class="header">
  <div class="container">
    <div class="header-row">
      <div class="header-left">
        <a class="header-home" href="../../index.html">⌂</a>
        <span class="header-title">Jura Marathon Planner</span>
      </div>
      <div class="header-right">
        <div class="unit-toggle" onclick="toggleUnits()">
          <div id="u-km" class="u-btn active">km</div>
          <div id="u-mi" class="u-btn">mi</div>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="container" id="app">
  <div id="raceCountdown"></div>

  <div class="hero-status">
    <div class="hero-main">
      <div>
        <span class="hero-val" id="hero-done">0</span>
        <span style="font-size: 0.8rem; color:var(--app-on-primary3);" id="hero-unit">KM</span>
      </div>
      <div class="hero-target">Goal: <span id="hero-goal">0</span></div>
    </div>
    <div class="progress-rail"><div class="progress-fill" id="hero-fill"></div></div>
    <div class="hero-footer">
      <span id="hero-percent">0% COMPLETE</span>
      <span id="hero-countdown">0 DAYS TO RACE</span>
    </div>
  </div>

  <div class="accordion-controls">
    <button class="accordion-btn" onclick="expandAllWeeks()">Expand all</button>
    <button class="accordion-btn" onclick="collapseAllWeeks()">Collapse all</button>
  </div>

  <div id="dashboard"></div>
  <button class="btn-reset" onclick="resetPlan()">Reset Data</button>
</div>

<script src="../../shared/utils.js"></script>
<script>
const TYPE_LABELS = { easy:'Easy', tempo:'Tempo', long:'Long run', interval:'Intervals', race:'Race', rest:'Rest', cross:'Cross' };
const TYPE_COLORS = { easy:'#3b6d11', tempo:'#ef9f27', long:'#185fa5', interval:'#c0392b', race:'#7f77dd', cross:'#20a080', rest:'#aaa' };
const miToKm = 1.60934;

let WEEKS = [];
let PROFILE = {};
let useKm = localStorage.getItem('unitPref') !== 'mi';

function toggleUnits() {
  useKm = !useKm;
  localStorage.setItem('unitPref', useKm ? 'km' : 'mi');
  document.getElementById('u-km').className = useKm ? 'u-btn active' : 'u-btn';
  document.getElementById('u-mi').className = !useKm ? 'u-btn active' : 'u-btn';
  render();
}

function render() {
  const container = document.getElementById('dashboard');
  container.innerHTML = '';
  let totalKm = 0, doneKm = 0;
  const now = new Date();
  const raceDate = new Date(PROFILE.raceGoal ? PROFILE.raceGoal.date : '2026-06-14');
  const daysLeft = Math.ceil((raceDate - now) / 86400000);

  WEEKS.forEach((wk, wkIdx) => {
    let wkDoneCount = 0;
    const wkStart = new Date(wk.weekStart + 'T00:00:00');
    const wkEnd = new Date(wkStart.getTime() + (7 * 86400000));
    const isCurrentWeek = now >= wkStart && now < wkEnd;

    let wkRowsHtml = '';
    wk.sessions.forEach((session, dIdx) => {
      const id = `jura-session-${wk.weekNumber}-${session.date}`;
      const isDone = localStorage.getItem(id) === 'true';
      const d = new Date(session.date + 'T00:00:00');
      
      const displayDist = useKm ? session.plannedKm.toFixed(1) : (session.plannedKm / miToKm).toFixed(1);
      const unit = useKm ? 'km' : 'mi';
      const distText = session.plannedKm > 0 ? `<span class="dist-bold">${displayDist} ${unit}</span> — ` : '';

      totalKm += session.plannedKm;
      if(isDone) { doneKm += session.plannedKm; wkDoneCount++; }

      const typeClass = `type-${session.type || 'rest'}`;
      
      wkRowsHtml += `
        <div class="day-row">
          <input type="checkbox" class="day-checkbox" ${isDone ? 'checked' : ''} onchange="toggle('${id}')">
          <div class="date-box">
            <span class="d-name">${d.toLocaleDateString('en-US', {weekday:'short'})}</span>
            <span class="d-num">${d.getDate()}</span>
          </div>
          <div class="session-type"><span class="pill ${typeClass}">${TYPE_LABELS[session.type] || session.type}</span></div>
          <div class="workout-text ${isDone ? 'completed' : ''}">
            ${distText}${session.notes || (isDone ? '✓ Done' : 'Planned')}
          </div>
        </div>`;
    });

    const manualState = localStorage.getItem(`wk-open-${wk.weekNumber}`);
    const isOpen = manualState === 'true' || (manualState === null && isCurrentWeek);

    const weekDiv = document.createElement('div');
    weekDiv.className = 'week-sect';
    
    const wkPlanned = wk.sessions.reduce((sum, s) => sum + (s.plannedKm || 0), 0);
    const wkDone = wk.sessions.filter(s => localStorage.getItem(`jura-session-${wk.weekNumber}-${s.date}`) === 'true').reduce((sum, s) => sum + (s.plannedKm || 0), 0);
    
    weekDiv.innerHTML = `
      <div class="week-header ${isCurrentWeek ? 'active-week' : ''}" onclick="toggleWeek(${wk.weekNumber})">
        <div style="flex:1">
          <div class="week-title">Week ${wk.weekNumber} ${isCurrentWeek ? ' <span style="color:var(--app-accent); font-size:0.6rem;">• CURRENT</span>' : ''}</div>
          <div class="week-summary">${wkDoneCount}/7 Completed</div>
        </div>
        <div style="text-align:right; margin-right:12px">
          <div style="font-size:0.85rem; font-weight:bold">${(useKm ? wkDone : wkDone/miToKm).toFixed(1)} / ${(useKm ? wkPlanned : wkPlanned/miToKm).toFixed(1)} ${useKm ? 'km' : 'mi'}</div>
          <div style="font-size:0.7rem; color:#999">${wkPlanned > 0 ? Math.round(wkDone/wkPlanned*100) : 0}%</div>
        </div>
        <div class="week-toggle ${isOpen ? 'open' : ''}">▼</div>
      </div>
      <div class="week-content ${isOpen ? 'open' : ''}">${wkRowsHtml}</div>
    `;
    container.appendChild(weekDiv);
  });

  // Update hero banner
  const goalDist = useKm ? totalKm : (totalKm / miToKm);
  const runDist = useKm ? doneKm : (doneKm / miToKm);
  const percent = Math.round((doneKm / totalKm) * 100);

  document.getElementById('hero-done').innerText = runDist.toFixed(1);
  document.getElementById('hero-goal').innerText = goalDist.toFixed(1);
  document.getElementById('hero-unit').innerText = useKm ? 'KM' : 'MI';
  document.getElementById('hero-fill').style.width = percent + '%';
  document.getElementById('hero-percent').innerText = percent + '% COMPLETE';
  document.getElementById('hero-countdown').innerText = (daysLeft > 0 ? daysLeft : 0) + ' DAYS TO RACE';
  document.getElementById('u-km').className = useKm ? 'u-btn active' : 'u-btn';
  document.getElementById('u-mi').className = !useKm ? 'u-btn active' : 'u-btn';
}

function toggle(id) {
  const current = localStorage.getItem(id) === 'true';
  localStorage.setItem(id, current ? 'false' : 'true');
  render();
}

function toggleWeek(wkNum) {
  const key = `wk-open-${wkNum}`;
  const current = localStorage.getItem(key) === 'true';
  localStorage.setItem(key, current ? 'false' : 'true');
  render();
}

function expandAllWeeks() {
  WEEKS.forEach(w => localStorage.setItem(`wk-open-${w.weekNumber}`, 'true'));
  render();
}

function collapseAllWeeks() {
  WEEKS.forEach(w => localStorage.setItem(`wk-open-${w.weekNumber}`, 'false'));
  render();
}

function resetPlan() {
  if(confirm("Wipe all logged data?")) {
    for (let key in localStorage) {
      if (key.startsWith('jura-session-') || key.startsWith('wk-open-')) {
        localStorage.removeItem(key);
      }
    }
    render();
  }
}

(async () => {
  const raw = await fetchData('../../data/training.json');
  if (!raw) return;
  PROFILE = raw.profile || {};
  WEEKS = raw.weeks || [];

  if (!WEEKS.length) {
    document.getElementById('app').innerHTML = '<div style="color:var(--muted);font-size:13px">No training weeks in training.json yet.</div>';
    return;
  }

  document.getElementById('u-km').className = useKm ? 'u-btn active' : 'u-btn';
  document.getElementById('u-mi').className = !useKm ? 'u-btn active' : 'u-btn';

  render();
})();
</script>
</body>
</html>
