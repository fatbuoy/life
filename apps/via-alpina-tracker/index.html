<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Via Alpina Hike Replay</title>
    <link href="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="stage-banner" class="panel hidden">
        <div class="unit-toggle-container">
            <span class="unit-label" id="unit-label-km">KM</span>
            <label class="ios-switch">
                <input type="checkbox" id="unit-toggle-checkbox">
                <span class="ios-slider"></span>
            </label>
            <span class="unit-label" id="unit-label-mi">MI</span>
        </div>

        <div class="banner-header">
            <h1 id="banner-stage-name">
                <span id="glowing-dot"></span>
                <span id="stage-name-text">Loading Stage...</span>
            </h1>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <span id="label-distance" class="stat-label">Total Distance</span>
                <span id="stat-distance" class="stat-val">0.0 km</span>
            </div>
            <div class="stat-box">
                <span id="label-ascent" class="stat-label">Total Ascent</span>
                <span id="stat-ascent" class="stat-val">↗ 0m</span>
            </div>
            <div class="stat-box">
                <span id="label-descent" class="stat-label">Total Descent</span>
                <span id="stat-descent" class="stat-val">↘ 0m</span>
            </div>
        </div>

        <div class="chart-container">
            <div id="chart-hiker-marker" style="display: none;">
                <i class="fa-solid fa-person-hiking"></i>
            </div>
            
            <svg id="elevation-chart" viewBox="0 0 400 60" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="chart-grad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#09090b" stop-opacity="0.18"/>
                        <stop offset="100%" stop-color="#09090b" stop-opacity="0.0"/>
                    </linearGradient>
                    <linearGradient id="progress-grad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="var(--chart-line-color, #3b82f6)" stop-opacity="0.4"/>
                        <stop offset="100%" stop-color="var(--chart-line-color, #3b82f6)" stop-opacity="0.05"/>
                    </linearGradient>
                </defs>
                <path id="chart-bg-path" d="" fill="url(#chart-grad)" stroke="none"/>
                <path id="chart-base-line" d="" fill="none" stroke="rgba(9, 9, 11, 0.15)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
                <path id="chart-prog-fill" d="" fill="url(#progress-grad)" stroke="none"/>
                <path id="chart-prog-path" d=\"\" fill="none" stroke="var(--chart-line-color, #3b82f6)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
            </svg>
        </div>
    </div>

    <div id="map"></div>

    <div id="control-panel" class="panel minimal-panel">
        <div id="mobile-toggle-handle" class="mobile-toggle-handle"></div>

        <div class="control-row inline-controls">
            <button id="btn-play-pause" title="Play / Pause"><i class="fa-solid fa-play"></i></button>
            <button id="btn-restart" title="Restart Track Simulation"><i class="fa-solid fa-rotate-left"></i></button>
            <div class="speed-slider-container">
                <span class="slider-icon"><i class="fa-solid fa-gauge-high"></i></span>
                <input type="range" id="speed-range" min="10" max="120" value="60">
            </div>
        </div>

        <ul id="stage-list"></ul>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
