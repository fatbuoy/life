<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Via Alpina Hike Replay</title>
    
    <link href="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.css" rel="stylesheet" />
    
    <script src="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Add this right inside the <body> tag -->
<div id="stage-banner" class="panel hidden">
    <div class="banner-header">
        <span class="live-indicator">● LIVE REPLAY</span>
        <h1 id="banner-stage-name">Loading Stage...</h1>
    </div>
    <div class="banner-stats">
        <div class="stat-box">
            <span class="stat-label">Distance</span>
            <span class="stat-val" id="stat-distance">0.0 km</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">Ascent</span>
            <span class="stat-val elevation" id="stat-ascent">+0m</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">Descent</span>
            <span class="stat-val elevation" id="stat-descent">-0m</span>
        </div>
    </div>
</div>


<!-- ... rest of your index.html remains the same ... -->
    <div id="map"></div>

    <div id="control-panel" class="panel">
        <h2>Via Alpina Replay</h2>
        <p class="subtitle">Upload your GPX files to begin</p>
        
        <div class="control-group">
            <label for="gpx-input" class="custom-file-upload">
                📂 Select GPX Stages
            </label>
            <input type="file" id="gpx-input" multiple accept=".gpx" />
        </div>

        <div id="playback-controls" class="hidden">
            <hr>
            <div class="stats">
                <div><strong>Stages loaded:</strong> <span id="stage-count">0</span></div>
                <div><strong>Current Position:</strong> <span id="current-stats">-</span></div>
            </div>
            <div class="button-row">
                <button id="btn-play-pause">▶ Play</button>
                <button id="btn-restart">🔄 Restart</button>
            </div>
            <div class="speed-control">
                <label for="speed-range">Speed:</label>
                <input type="range" id="speed-range" min="1" max="50" value="10">
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
