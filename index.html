<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fatboys LifeOS</title>
<link rel="stylesheet" href="./shared/base.css">
<style>
/* Hub theme — navy default */
:root {
  --app-primary:    #0c2340;
  --app-primary2:   #1a3a5c;
  --app-primary3:   #2d5a8a;
  --app-accent:     #185fa5;
  --app-on-primary:    #ffffff;
  --app-on-primary2:   #a8cfed;
  --app-on-primary3:   #7fa8cc;
}

.greeting { font-size: var(--t-lg); font-weight: 600; color: var(--text); margin-bottom: 2px }
.greeting-date { font-size: var(--t-sm); color: var(--muted); margin-bottom: 20px }

/* App grid — footer cards */
.apps-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px }
@media (min-width: 600px) { .apps-grid { grid-template-columns: repeat(3, 1fr) } }

.app-card.budget    .app-card-header { background: #1a3a1a }
.app-card.calories  .app-card-header { background: #0d3535 }
.app-card.recipes   .app-card-header { background: #3a1020 }
.app-card.travel    .app-card-header { background: #1a1050 }
.app-card.training  .app-card-header { background: #1a2535 }

/* Section divider */
.dash-divider { height: 1px; background: var(--border); margin: 24px 0 }
</style>
</head>
<body>

<header class="header">
  <div class="container">
    <div class="header-row">
      <div class="header-left">
        <span class="header-title">Fatboys LifeOS</span>
      </div>
      <div class="header-right">
        <span class="header-badge" id="todayBadge">—</span>
      </div>
    </div>
  </div>
</header>

<div id="chartTooltip"></div>

<div class="container" id="app">
  <div class="greeting" id="greeting">—</div>
  <div class="greeting-date" id="greetingDate">—</div>

  <!-- EAT SECTION -->
  <div class="dash-section" id="eatSection">
    <div class="dash-section-title">🍽️ EAT</div>
    <div class="dash-grid" id="eatContent">
      <div class="card">
        <div class="card-body">
          <div style="color: var(--muted); font-size: var(--t-sm)">Loading nutrition plan…</div>
        </div>
      </div>
    </div>
  </div>

  <!-- RUN SECTION -->
  <div class="dash-section" id="runSection">
    <div class="dash-section-title">🏃 RUN</div>
    <div class="dash-grid" id="runContent">
      <div class="card">
        <div class="card-body">
          <div style="color: var(--muted); font-size: var(--t-sm)">Loading training plan…</div>
        </div>
      </div>
    </div>
  </div>

  <!-- LIVE SECTION -->
  <div class="dash-section" id="liveSection">
    <div class="dash-section-title">🌍 LIVE</div>
    <div class="dash-grid" id="liveContent">
      <div class="card">
        <div class="card-body">
          <div style="color: var(--muted); font-size: var(--t-sm)">Loading life summary…</div>
        </div>
      </div>
    </div>
  </div>

  <div class="dash-divider"></div>

  <!-- Apps footer -->
  <div class="sec-lbl" id="appsLabel">Apps</div>
  <div class="apps-grid" id="appGrid"></div>
</div>

<script src="./shared/utils.js"></script>
<script>
const APPS = [
  { id: 'budget',   label: 'Pocket Change', icon: '🪙', sub: 'Budget & actuals',     path: './apps/03-budget-tracker/budget-tracker.html' },
  { id: 'calories', label: 'Fuel Plan',     icon: '🔥', sub: 'Daily nutrition',      path: './apps/01-calorie-planner/calorie-planner.html' },
  { id: 'recipes',  label: "FatBoy's Kitchen", icon: '🥘', sub: 'Recipes & macros', path: './apps/02-recipe-book/recipe-book.html' },
  { id: 'travel',   label: 'Wanderer',      icon: '✈️',  sub: 'Trips & itineraries', path: './apps/04-travel-planner/travel-planner.html' },
  { id: 'training', label: 'Run Log',       icon: '🏃', sub: 'Training & races',     path: './apps/05-training-planner/training-planner.html' },
];

const today = new Date().toISOString().slice(0, 10);
let allData = {};

/* ─── Greeting ──────────────────────────────────────────────────── */
function renderGreeting() {
  const now = new Date();
  const hour = now.getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  document.getElementById('greeting').textContent = greeting + ' 👋';
  document.getElementById('greetingDate').textContent = 
    now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  document.getElementById('todayBadge').textContent =
    now.toLocaleDateString('en-US', { day: 'numeric', month: 'short' });
}

/* ─── App Grid ──────────────────────────────────────────────────── */
function renderAppGrid() {
  const grid = document.getElementById('appGrid');
  grid.innerHTML = APPS.map(app => `
    <a class="app-card ${app.id}" href="${app.path}">
      <div class="app-card-header">
        <div class="app-card-icon">${app.icon}</div>
        <div class="app-card-title">${app.label}</div>
        <div class="app-card-sub">${app.sub}</div>
      </div>
      <div class="app-card-body">
        <div class="app-card-stat" id="stat-${app.id}">→ Open app</div>
      </div>
    </a>`).join('');
}

/* ─── EAT SECTION ───────────────────────────────────────────────── */
async function renderEatSection() {
  const recipes = allData.recipes || null;
  const calories = allData.calories || null;
  
  if (!calories) {
    document.getElementById('eatContent').innerHTML = 
      `<div class="card"><div class="card-body"><div style="color:var(--muted)">No nutrition data</div></div></div>`;
    return;
  }

  const phase = (calories.phases || []).find(p => today >= p.start_date && today <= p.end_date);
  const week = (calories.weeks || []).find(w => today >= w.week_start && today <= w.week_end);
  const dayData = week ? (week.days || []).find(d => d.date === today) : null;

  let html = '';
  if (phase && dayData) {
    html = `
      <div class="card">
        <div class="card-body">
          <div class="kpi-label">Today's Fuel</div>
          <div class="kpi-value" style="font-size: var(--t-xl); margin: 6px 0">${dayData.target_kcal || phase.avg_kcal} kcal</div>
          <div class="kpi-sub">${phase.label}</div>
          <div style="margin-top: 8px; font-size: 11px; color: var(--muted)">
            Protein ${dayData.target_protein || 110}g
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          <div class="kpi-label">This Week</div>
          <ul class="quick-list">
            <li class="quick-list-item">
              <span class="quick-list-emoji">📊</span>
              <span class="quick-list-label">Avg daily</span>
              <span class="quick-list-value">${phase.avg_kcal} kcal</span>
            </li>
            <li class="quick-list-item">
              <span class="quick-list-emoji">🏃</span>
              <span class="quick-list-label">Run day</span>
              <span class="quick-list-value">${phase.run_kcal} kcal</span>
            </li>
            <li class="quick-list-item">
              <span class="quick-list-emoji">🧘</span>
              <span class="quick-list-label">Rest day</span>
              <span class="quick-list-value">${phase.rest_kcal} kcal</span>
            </li>
          </ul>
        </div>
      </div>
    `;
  } else {
    html = `<div class="card"><div class="card-body">
      <div style="color: var(--muted); font-size: var(--t-sm)">No data for today. View Fuel Plan →</div>
    </div></div>`;
  }
  document.getElementById('eatContent').innerHTML = html;
}

/* ─── RUN SECTION ───────────────────────────────────────────────── */
async function renderRunSection() {
  const training = allData.training || null;
  
  if (!training) {
    document.getElementById('runContent').innerHTML = 
      `<div class="card"><div class="card-body"><div style="color:var(--muted)">No training data</div></div></div>`;
    return;
  }

  const goal = training.profile?.raceGoal;
  const week = (training.weeks || []).find(w => today >= w.weekStart && today <= w.weekStart.slice(0,7) + '-' + (parseInt(w.weekStart.slice(8))+6));
  const session = week ? (week.sessions || []).find(s => s.date === today) : null;

  const daysToRace = goal ? daysUntil(goal.date) : null;

  let html = '';
  if (goal && daysToRace !== null) {
    html = `
      <div class="card">
        <div class="card-body">
          <div class="kpi-label">Race Countdown</div>
          <div class="kpi-value" style="font-size: 28px; margin: 6px 0; color: var(--app-accent)">${daysToRace}</div>
          <div class="kpi-sub">days to ${goal.name}</div>
          <div style="margin-top: 6px; font-size: 10px; color: var(--muted)">
            Target: ${goal.targetTime || 'TBC'}
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          <div class="kpi-label">Today's Session</div>
          ${session ? `
            <div style="margin: 8px 0; padding: 8px; background: var(--surface); border-radius: var(--r-md)">
              <div style="font-weight: 600; text-transform: capitalize; color: var(--text)">${session.type}</div>
              <div style="font-size: 13px; font-weight: 600; color: var(--app-accent); margin: 4px 0">${session.plannedKm} km</div>
              <div style="font-size: 11px; color: var(--muted)">${session.notes}</div>
            </div>
          ` : `
            <div style="color: var(--muted); font-size: 12px">Rest day</div>
          `}
        </div>
      </div>
    `;
  } else {
    html = `<div class="card"><div class="card-body">
      <div style="color: var(--muted); font-size: var(--t-sm)">No race goal set. View Run Log →</div>
    </div></div>`;
  }
  document.getElementById('runContent').innerHTML = html;
}

/* ─── LIVE SECTION ──────────────────────────────────────────────── */
async function renderLiveSection() {
  const budget = allData.budget || null;
  const travel = allData.travel || null;

  if (!budget && !travel) {
    document.getElementById('liveContent').innerHTML = 
      `<div class="card"><div class="card-body"><div style="color:var(--muted)">No life data</div></div></div>`;
    return;
  }

  // Budget: Month-to-date
  let mtdSpend = 0, mtdBudget = 0;
  const currentYear = new Date().getFullYear();
  const currentMonth = new Date().toLocaleString('default', { month: 'short' });
  
  if (budget && budget.data) {
    const thisMonth = budget.data.filter(d => d.year === currentYear && d.month === currentMonth);
    mtdSpend = sumBy(thisMonth.filter(d => d.source === 'Actual'), r => r.amount);
    mtdBudget = sumBy(thisMonth.filter(d => d.source === 'Budget'), r => r.amount);
  }

  // Travel: Upcoming trips
  let trips = [];
  if (travel && travel.trips) {
    trips = travel.trips
      .filter(t => (t.status === 'Planned' || t.status === 'Confirmed') && t.startDate >= today)
      .sort((a, b) => new Date(a.startDate) - new Date(b.startDate))
      .slice(0, 2);
  }

  let html = `
    <div class="card">
      <div class="card-body">
        <div class="kpi-label">${currentMonth} Spend</div>
        <div class="kpi-value" style="font-size: 24px; margin: 4px 0">CHF ${fmt(mtdSpend)}</div>
        ${mtdBudget > 0 ? `
          <div style="font-size: 11px; color: var(--muted)">
            Budget: CHF ${fmt(mtdBudget)} (${Math.round(mtdSpend/mtdBudget*100)}%)
          </div>
        ` : ''}
      </div>
    </div>
    <div class="card">
      <div class="card-body">
        <div class="kpi-label">Next Trips</div>
        ${trips.length > 0 ? `
          <ul class="quick-list">
            ${trips.map(t => `
              <li class="quick-list-item">
                <span class="quick-list-emoji">✈️</span>
                <span class="quick-list-label">${t.destination}</span>
                <span class="quick-list-value" style="font-size: 10px">${daysUntil(t.startDate)}d</span>
              </li>
            `).join('')}
          </ul>
        ` : `
          <div style="color: var(--muted); font-size: 12px">No trips planned</div>
        `}
      </div>
    </div>
  `;
  document.getElementById('liveContent').innerHTML = html;
}

/* ─── Load & Render ─────────────────────────────────────────────── */
async function init() {
  renderGreeting();
  renderAppGrid();

  // Load all data
  try {
    allData.recipes  = await fetchData('./data/recipes.json');
  } catch(e) { allData.recipes = null; }
  
  try {
    allData.calories = await fetchData('./data/calories.json');
  } catch(e) { allData.calories = null; }
  
  try {
    allData.training = await fetchData('./data/training.json');
  } catch(e) { allData.training = null; }
  
  try {
    allData.budget   = await fetchData('./data/budget.json');
  } catch(e) { allData.budget = null; }
  
  try {
    allData.travel   = await fetchData('./data/travel.json');
  } catch(e) { allData.travel = null; }

  // Render sections
  await renderEatSection();
  await renderRunSection();
  await renderLiveSection();
}

init();
</script>
</body>
</html>
