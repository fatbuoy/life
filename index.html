<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FatBoy's LifeOS</title>

<link rel="icon" href="https://api.iconify.design/mdi:lightning-bolt-circle.svg?color=%23185fa5" type="image/svg+xml">

<link rel="stylesheet" href="./shared/base.css">
<script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>

<style>
:root {
  --app-primary: #0c2340; /* Navy Header */
  --bg-light: #f8fafc;
  --color-eat: #0d3535;   
  --color-run: #d06020;    
  --color-live: #1a3a1a;  
}

body { background: var(--bg-light); color: var(--text); -webkit-font-smoothing: antialiased; }

/* ── INTERACTIVE TILE ANIMATIONS ── */
.hub-card {
  background: var(--white);
  border: 1px solid var(--border);
  padding: 16px;
  border-radius: var(--r-lg);
  text-decoration: none !important; /* Remove underline */
  color: inherit;
  display: flex;
  flex-direction: column;
  transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  position: relative;
  overflow: hidden;
}

/* Hover "Glow & Lift" Effects */
.hub-card:hover {
  transform: translateY(-4px);
  border-color: transparent;
  box-shadow: 0 12px 24px rgba(0,0,0,0.06);
}

/* Pillar-Specific Hover Glows */
.pillar-eat:hover { border-color: var(--color-eat); box-shadow: 0 8px 25px -5px rgba(13, 53, 53, 0.15); }
.pillar-run:hover { border-color: var(--color-run); box-shadow: 0 8px 25px -5px rgba(208, 96, 32, 0.2); }
.pillar-live:hover { border-color: var(--color-live); box-shadow: 0 8px 25px -5px rgba(26, 58, 26, 0.15); }

.hub-card:active { transform: scale(0.97); transition: all 0.1s; }

/* ── LAYOUT ── */
.header { position: sticky; top: 0; z-index: 100; width: 100%; }
.container { max-width: 480px; padding: 20px; margin: 0 auto; }
.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.full-card { grid-column: 1 / -1; }

.pillar-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 24px 0 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.pillar-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; }
.kpi-lbl { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
.kpi-val { font-size: 24px; font-weight: 800; color: var(--text); line-height: 1.1; }
.kpi-sub { font-size: 11px; margin-top: 6px; font-weight: 600; }
</style>
</head>
<body>

<header class="header">
  <div class="container" style="padding-top:0; padding-bottom:0;">
    <div class="header-row">
      <div class="header-left"><span class="header-title">FatBoy's LifeOS</span></div>
      <div class="header-right"><span class="header-badge" id="todayBadge">--</span></div>
    </div>
  </div>
</header>

<div class="container">
  <header style="margin: 8px 0 24px;">
    <h1 id="greeting" style="font-size: 28px; font-weight: 800; letter-spacing: -0.03em;">...</h1>
    <p id="greetingDate" style="color: var(--muted); font-size: 14px;"></p>
  </header>

  <div class="pillar-header">
    <span class="iconify" data-icon="mdi:fire" style="color: var(--color-eat)"></span>
    <span class="pillar-title" style="color: var(--color-eat)">Eat • Fuel</span>
  </div>
  <div class="dash-grid">
    <a href="./apps/01-calorie-planner/calorie-planner.html" class="hub-card pillar-eat">
      <div class="kpi-lbl">Today's Target</div>
      <div class="kpi-val" id="kcal-val">----</div>
      <div class="kpi-sub" style="color: var(--color-eat)" id="kcal-label">SYNCING...</div>
    </a>
    <a href="./apps/02-recipe-book/recipe-book.html" class="hub-card pillar-eat">
      <div class="kpi-lbl">Library</div>
      <div class="kpi-val" id="recipe-count">0</div>
      <div class="kpi-sub" style="color: var(--muted)">RECIPES</div>
    </a>
  </div>

  <div class="pillar-header">
    <span class="iconify" data-icon="mdi:run-fast" style="color: var(--color-run)"></span>
    <span class="pillar-title" style="color: var(--color-run)">Run • Training</span>
  </div>
  <div class="dash-grid">
    <a href="./apps/05-training-planner/training-planner.html" class="hub-card full-card pillar-run" style="border-left: 4px solid var(--color-run)">
      <div class="kpi-lbl" id="run-phase">Current Phase</div>
      <div class="kpi-val" id="today-session" style="font-size: 18px;">Loading...</div>
      <div class="kpi-sub" id="run-notes" style="font-weight: 400; color: var(--muted)">--</div>
    </a>
    <div class="hub-card pillar-run">
      <div class="kpi-lbl">Countdown</div>
      <div class="kpi-val" id="race-days">0</div>
      <div class="kpi-sub" style="color: var(--color-run)">DAYS TO RACE</div>
    </div>
    <div class="hub-card pillar-run">
      <div class="kpi-lbl">Volume</div>
      <div class="kpi-val" id="week-vol">0.0</div>
      <div class="kpi-sub" style="color: var(--muted)">WEEKLY KM</div>
    </div>
  </div>

  <div class="pillar-header">
    <span class="iconify" data-icon="mdi:currency-chf" style="color: var(--color-live)"></span>
    <span class="pillar-title" style="color: var(--color-live)">Live • Logistics</span>
  </div>
  <div class="dash-grid">
    <a href="./apps/03-budget-tracker/budget-tracker.html" class="hub-card pillar-live">
      <div class="kpi-lbl">YTD Spend</div>
      <div class="kpi-val" id="spend-val" style="font-size: 19px;">CHF --</div>
      <div class="kpi-sub" style="color: var(--color-live)">2026 ACTUALS</div>
    </a>
    <a href="./apps/04-travel-planner/travel-planner.html" class="hub-card pillar-live">
      <div class="kpi-lbl">Next Trip</div>
      <div class="kpi-val" id="next-trip" style="font-size: 19px;">---</div>
      <div class="kpi-sub" id="trip-days" style="color: var(--muted)">---</div>
    </a>
  </div>
</div>

<script src="./shared/utils.js"></script>
<script>
const today = new Date().toISOString().slice(0, 10);
const curYear = 2026; 
let allData = {};

async function init() {
  const now = new Date();
  document.getElementById('todayBadge').textContent = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }).toUpperCase();
  document.getElementById('greetingDate').textContent = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  
  const hour = now.getHours();
  document.getElementById('greeting').textContent = hour < 12 ? 'Good Morning' : hour < 18 ? 'Good Afternoon' : 'Good Evening';

  const datasets = ['recipes', 'calories', 'training', 'budget', 'travel'];
  await Promise.all(datasets.map(async k => {
    try {
      allData[k] = await fetchData(`./data/${k}.json`);
    } catch(e) { console.warn(`Data fail: ${k}`); }
  }));

  render();
}

function render() {
  // 1. EAT: Strict Date Lookup (e.g. 12 May 2026 -> 2050 kcal)
  if (allData.calories) {
    const allDays = allData.calories.weeks.flatMap(w => w.days);
    const dayEntry = allDays.find(d => d.date === today);
    if (dayEntry) {
      document.getElementById('kcal-val').textContent = dayEntry.kcal;
      document.getElementById('kcal-label').textContent = dayEntry.activity.toUpperCase();
    }
    document.getElementById('recipe-count').textContent = allData.recipes?.meta?.count || 0;
  }

  // 2. RUN: Training Stats
  if (allData.training) {
    const goal = allData.training.profile.raceGoal;
    const raceDate = new Date(goal.date);
    const diff = Math.ceil((raceDate - new Date()) / 86400000);
    document.getElementById('race-days').textContent = diff;

    const currentWeek = allData.training.weeks.find(w => {
      const s = new Date(w.weekStart);
      const e = new Date(s); e.setDate(s.getDate() + 7);
      return new Date() >= s && new Date() < e;
    });

    if (currentWeek) {
      document.getElementById('run-phase').textContent = currentWeek.phase.toUpperCase();
      const session = currentWeek.sessions.find(s => s.date === today);
      if (session) {
        document.getElementById('today-session').textContent = session.type === 'rest' ? 'Rest Day' : `${session.plannedKm}km ${session.type.toUpperCase()}`;
        document.getElementById('run-notes').textContent = session.notes || 'Recovery focus';
      }
      const vol = currentWeek.sessions.reduce((acc, s) => acc + (s.actualKm || 0), 0);
      document.getElementById('week-vol').textContent = vol.toFixed(1);
    }
  }

  // 3. LIVE: YTD Spend (Summing 2026 Actuals)
  if (allData.budget) {
    const ytdActuals = allData.budget.data.filter(d => d.year === curYear && d.source === 'Actuals');
    const totalYTD = ytdActuals.reduce((sum, r) => sum + r.amount, 0);
    document.getElementById('spend-val').textContent = `CHF ${Math.round(totalYTD).toLocaleString()}`;
  }

  if (allData.travel) {
    const next = allData.travel.trips
      .filter(t => t.startDate >= today)
      .sort((a,b) => new Date(a.startDate) - new Date(b.startDate))[0];
    if (next) {
      document.getElementById('next-trip').textContent = next.destination.split(',')[0];
      const d = Math.ceil((new Date(next.startDate) - new Date()) / 86400000);
      document.getElementById('trip-days').textContent = `T-MINUS ${d} DAYS`;
    }
  }
}

init();
</script>
</body>
</html>
